name: Repair Final Mobile Haven Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-final-mobile-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Apply bounded compiler corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(file_name, old, new, label):
              path = Path(file_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              path.write_text(text.replace(old, new, 1))

          model = "src/Haven.Android/ModelBrowserActivity.cs"
          replace_once(
              model,
              '        _search = new EditText(this)\n        {\n            Hint = "Model name, creator, or feature",\n            SingleLine = true\n        };',
              '        _search = new EditText(this)\n        {\n            Hint = "Model name, creator, or feature"\n        };\n        _search.SetSingleLine(true);',
              "Android single-line API")
          replace_once(model, "IDalogInterface?", "IDialogInterface?", "dialog interface spelling")
          replace_once(
              model,
              '[property: JsonPropertyName("tags")] string[]? TagsK\n        [property: JsonPropertyName("siblings")]',
              '[property: JsonPropertyName("tags")] string[]? Tags,\n        [property: JsonPropertyName("siblings")]',
              "Hugging Face record parameter")

          replace_once(
              "src/Haven.Desktop/Views/StudioProjectView.axaml.cs",
              "Panel.SetZIndex(_settingsOverlay, 100);",
              "_settingsOverlay.SetValue(Panel.ZIndexProperty, 100);",
              "Avalonia Z-index attached property")

          print("Applied and verified 4 bounded source corrections.")
          PY

      - name: Commit targeted corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/ModelBrowserActivity.cs src/Haven.Desktop/Views/StudioProjectView.axaml.cs
          git commit -m "Repair remaining Mobile Haven build errors"
          git push origin HEAD:mobile-haven-outstanding-fixes

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
