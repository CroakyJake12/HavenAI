name: Compile Mobile Haven APK Shell Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compile-mobile-haven-apk-shellfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Repair Android shell control references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  print(f"{label} already applied.")
                  return
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              path.write_text(text.replace(old, new, 1))

          layout = Path("src/Haven.Android/MainView.Mobile.Layout.cs")
          replace_once(
              layout,
              "    private TextBox? _mobileGoInput;\n",
              "    private TextBox? _mobileGoInput;\n    private Control? _mobilePageContent;\n",
              "mobile page content field")

          old_layout = '''        TopRail.IsVisible = false;
        SidebarControl.IsVisible = false;
        NativeSidebarHost.IsVisible = false;
        ShellContextBar.IsVisible = false;
        body.ColumnDefinitions = new ColumnDefinitions("*");
        body.Margin = new Thickness(0);
        Grid.SetColumn(contentHost, 0);
        Grid.SetColumnSpan(contentHost, 1);

        ContentArea.BorderThickness = new Thickness(0);
        ContentArea.CornerRadius = new CornerRadius(0);
        ContentArea.Background = ResourceBrush("HavenBackgroundBrush");
        PageContent.Margin = new Thickness(0, 0, 0, 92);'''
          new_layout = '''        foreach (var child in root.Children.ToArray())
        {
            if (Grid.GetRow(child) == 0)
                child.IsVisible = false;
        }
        foreach (var child in body.Children.ToArray())
        {
            if (!ReferenceEquals(child, contentHost))
                child.IsVisible = false;
        }
        body.ColumnDefinitions = new ColumnDefinitions("*");
        body.Margin = new Thickness(0);
        Grid.SetColumn(contentHost, 0);
        Grid.SetColumnSpan(contentHost, 1);
        _mobilePageContent = contentHost;
        _mobilePageContent.Margin = new Thickness(0, 0, 0, 92);'''
          replace_once(layout, old_layout, new_layout, "structural mobile shell layout")

          interactions = Path("src/Haven.Android/MainView.Mobile.Interactions.cs")
          old_chrome = '''        SidebarControl.IsVisible = false;
        NativeSidebarHost.IsVisible = false;
        ShellContextBar.IsVisible = false;'''
          replace_once(interactions, old_chrome, "", "remove desktop named chrome references")
          old_margin = '''        PageContent.Margin = isHome
            ? new Thickness(0, 0, 0, 78)
            : showChatAffordance
                ? new Thickness(0, 0, 0, 112)
                : new Thickness(0);'''
          new_margin = '''        if (_mobilePageContent is not null)\n            _mobilePageContent.Margin = isHome\n                ? new Thickness(0, 0, 0, 78)\n                : showChatAffordance\n                    ? new Thickness(0, 0, 0, 112)\n                    : new Thickness(0);'''
          replace_once(interactions, old_margin, new_margin, "mobile content inset")

          for file in (layout, interactions):
              text = file.read_text()
              invalid = [
                  "TopRail.IsVisible",
                  "SidebarControl.IsVisible",
                  "NativeSidebarHost.IsVisible",
                  "ShellContextBar.IsVisible",
                  "ContentArea.",
                  "PageContent."
              ]
              remaining = [token for token in invalid if token in text]
              if remaining:
                  raise SystemExit(f"{file.name} still contains desktop-only named references: {remaining}")
          print("Validated runtime-located mobile shell controls.")
          PY

      - name: Commit shell correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/MainView.Mobile.Layout.cs src/Haven.Android/MainView.Mobile.Interactions.cs
          git commit -m "Repair Android mobile shell control references"
          git push origin HEAD:mobile-haven-outstanding-fixes

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Outstanding-Fixes-APK"
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
          } > .github/build-status/mobile-haven-apk.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-apk.txt
          git commit -m "Record successful Mobile Haven APK build"
          git push origin HEAD:mobile-haven-outstanding-fixes
