name: Merge beta pass into haven-continuation

on:
  push:
    branches:
      - gpt/new-haven-beta-pass
    paths:
      - .github/workflows/merge-beta-pass-into-haven-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-validate-push:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out haven-continuation
        uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch and merge beta pass
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gpt/new-haven-beta-pass
          git merge --no-ff --no-edit origin/gpt/new-haven-beta-pass

      - name: Restore
        shell: pwsh
        run: dotnet restore Haven.sln

      - name: Build
        shell: pwsh
        run: dotnet build Haven.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test Haven.sln -c Release --no-build

      - name: Push validated merge
        shell: pwsh
        run: git push origin HEAD:haven-continuation
