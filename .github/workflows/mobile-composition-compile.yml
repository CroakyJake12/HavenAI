name: Mobile Composition APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/mobile-composition-compile.yml"]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/mobile-desktop-parity-fixes-20260807
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          short="$(git rev-parse --short=8 HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          mkdir -p artifact
          git rev-parse HEAD > artifact/SOURCE_SHA.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install android
      - run: dotnet restore src/Haven.Android/Haven.Android.csproj
      - run: dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk" ]]; then apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -print -quit)"; fi
          test -n "$apk"
          cp "$apk" artifact/Haven-Mobile-Composition.apk
          test -s artifact/Haven-Mobile-Composition.apk
          unzip -t artifact/Haven-Mobile-Composition.apk > artifact/ZIP_TEST.txt
          unzip -Z1 artifact/Haven-Mobile-Composition.apk | grep -qx AndroidManifest.xml
          signer="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose artifact/Haven-Mobile-Composition.apk > artifact/APKSIGNER.txt
          sha256sum artifact/Haven-Mobile-Composition.apk > artifact/SHA256SUMS.txt
          stat --printf='%n %s bytes\n' artifact/Haven-Mobile-Composition.apk > artifact/SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-${{ steps.meta.outputs.short }}-Mobile-APK
          path: artifact
          if-no-files-found: error
          retention-days: 30
