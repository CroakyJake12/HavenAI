name: Repair Mobile Haven Build V4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-mobile-build-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Apply idempotent compiler corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path("src/Haven.Android/ModelBrowserActivity.cs")
          text = model.read_text()

          text = text.replace("            SingleLine = true\n", "")
          if "_query.SetSingleLine(true);" not in text:
              marker = "        _query.SetTextColor(Color.White);"
              if marker not in text:
                  raise SystemExit("query marker not found")
              text = text.replace(marker, "        _query.SetSingleLine(true);\n" + marker, 1)

          text = text.replace("root.AddView(Actions);", "root.AddView(actions);")
          text = text.replace("IDalogInterface?", "IDialogInterface?")
          text = text.replace("string[]? TagsK\n", "string[]? Tags,\n")

          if "using IOPath = System.IO.Path;" not in text:
              marker = "using System.Text.Json.Serialization;\n"
              if marker not in text:
                  raise SystemExit("using marker not found")
              text = text.replace(marker, marker + "using IOPath = System.IO.Path;\n", 1)
          text = text.replace("Path.", "IOPath.")

          model.write_text(text)

          desktop = Path("src/Haven.Desktop/Views/StudioProjectView.axaml.cs")
          dtext = desktop.read_text()
          dtext = dtext.replace(
              "Panel.SetZIndex(_settingsOverlay, 100);",
              "_settingsOverlay.SetValue(Panel.ZIndexProperty, 100);")
          desktop.write_text(dtext)

          required = {
              "android single-line call": "_query.SetSingleLine(true);" in text,
              "actions casing": "root.AddView(Actions);" not in text,
              "path alias": "using IOPath = System.IO.Path;" in text,
              "no ambiguous Path": "Path." not in text,
              "dialog spelling": "IDalogInterface" not in text,
              "record parameter": "TagsK" not in text,
              "avalonia z-Index": "_settingsOverlay.SetValue(Panel.ZIndexProperty, 100);" in dtext,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("validation failed: " + ", ".join(failed))
          print("Validated compiler corrections:", ", ".join(required))
          PY

      - name: Commit targeted corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Corrections already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Haven.Android/ModelBrowserActivity.cs src/Haven.Desktop/Views/StudioProjectView.axaml.cs
            git commit -m "Repair Mobile Haven Android compiler errors"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
