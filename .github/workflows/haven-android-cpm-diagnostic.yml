name: Haven Android CPM Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - '.github/workflows/haven-android-cpm-diagnostic.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Evaluate central package management
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          {
            echo "commit=${GITHUB_SHA}"
            dotnet --info
            echo
            dotnet msbuild src/Haven.Android/Haven.Android.csproj               -getProperty:ManagePackageVersionsCentrally               -getProperty:DirectoryPackagesPropsPath               -getProperty:ImportDirectoryPackagesProps               -getItem:PackageVersion               -getItem:PackageReference
            echo "evaluation_exit=$?"
          } > artifacts/android/cpm-evaluation.txt 2>&1
          cat artifacts/android/cpm-evaluation.txt
      - name: Persist evaluation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/cpm-evaluation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Haven Android CPM evaluation [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
