name: Emergency Android APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-apk-emergency.yml"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: haven-apk-export
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a508ed92aca25cf8badc1ccb33164ee3ed052c58
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash scripts/emergency_build_apk.sh
