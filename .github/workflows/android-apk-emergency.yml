# emergency multi-trigger 2026-08-07T00:13Z
name: Emergency Android APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-apk-emergency.yml"]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: haven-apk-export
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e08fae940a7cceff9a10f0b8040f576e85dcd8a3
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash scripts/emergency_build_apk.sh
