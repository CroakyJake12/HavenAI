name: Emergency Full Haven Android APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-apk-emergency.yml"]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          path: source
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - run: dotnet workload install android
      - working-directory: source
        run: dotnet restore src/Haven.Android/Haven.Android.csproj
      - working-directory: source
        run: dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - name: Verify full APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/full
          apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*-Signed.apk' -print | head -n 1)"
          test -n "$apk" || apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -print | head -n 1)"
          test -n "$apk"
          cp "$apk" artifacts/full/Haven-Full-Mobile.apk
          test -s artifacts/full/Haven-Full-Mobile.apk
          unzip -t artifacts/full/Haven-Full-Mobile.apk
          unzip -Z1 artifacts/full/Haven-Full-Mobile.apk | grep -qx AndroidManifest.xml
          signer="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose artifacts/full/Haven-Full-Mobile.apk
          sha256sum artifacts/full/Haven-Full-Mobile.apk > artifacts/full/SHA256SUMS.txt
          stat --printf='%n %s bytes\n' artifacts/full/Haven-Full-Mobile.apk > artifacts/full/SIZE.txt
          git rev-parse HEAD > artifacts/full/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Full-Android-APK
          path: source/artifacts/full
          if-no-files-found: error
          retention-days: 30
