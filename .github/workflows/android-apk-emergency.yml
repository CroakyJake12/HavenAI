# trigger: 2026-08-06T20:05+01:00
name: Emergency Android APK
'on':
  push:
    branches: [main]
    paths: [.github/workflows/android-apk-emergency.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: support
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          path: source
          fetch-depth: 0
      - name: Apply repairs
        working-directory: source
        run: python3 ../support/scripts/repair_mobile_remaining_compile_errors.py
      - name: Commit repairs
        working-directory: source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Haven.Android
            git commit -m "Resolve remaining Android compile errors"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json
      - run: dotnet workload install android
      - name: Publish APK
        working-directory: source
        run: dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - name: Collect APK
        working-directory: source
        run: |
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-APK
          path: source/artifacts/android
          if-no-files-found: error
