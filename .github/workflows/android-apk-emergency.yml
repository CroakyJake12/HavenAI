name: Emergency Android APK

on:
  push:
    branches: [main]
    paths: [".github/workflows/android-apk-emergency.yml"]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: haven-apk-export
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bd28a522e9377bf3074d1a05824746cb0d971c2
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash scripts/emergency_build_apk_v3.sh
