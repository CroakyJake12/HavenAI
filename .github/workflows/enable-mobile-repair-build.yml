name: Enable Haven Mobile Repair APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - '.github/workflows/enable-mobile-repair-build.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enable versioned API 36 build
        shell: bash
        run: |
          set -euo pipefail
          echo "b4d0c1c98853462c86ea4c70b41cdf4b459888cf279df244d7cf537f544f0492  scripts/enable_mobile_repair_build.py" | sha256sum -c -
          python -m py_compile scripts/enable_mobile_repair_build.py
          python scripts/enable_mobile_repair_build.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-haven-android.yml
          if ! git diff --cached --quiet; then
            git commit -m "Enable versioned API 36 Haven Mobile APK build [skip ci]"
            git push
          fi
