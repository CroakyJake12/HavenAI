name: Enable Haven Mobile Repair APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - '.github/workflows/enable-mobile-repair-build.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enable versioned API 36 build
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          echo "e0e47697c677e19f47d56dd6f6b818613af97d72d0b25fc4ec693e2d8d05ae46  scripts/enable_mobile_repair_build.py" | sha256sum -c - > artifacts/android/enable-build.log 2>&1
          hash_exit=$?
          if [ "$hash_exit" -eq 0 ]; then
            python -m py_compile scripts/enable_mobile_repair_build.py >> artifacts/android/enable-build.log 2>&1
            compile_exit=$?
          else
            compile_exit=99
          fi
          if [ "$compile_exit" -eq 0 ]; then
            python scripts/enable_mobile_repair_build.py >> artifacts/android/enable-build.log 2>&1
            patch_exit=$?
          else
            patch_exit=99
          fi

          {
            echo "input_commit=${GITHUB_SHA}"
            echo "hash_exit=$hash_exit"
            echo "compile_exit=$compile_exit"
            echo "patch_exit=$patch_exit"
            tail -n 200 artifacts/android/enable-build.log
          } > artifacts/android/enable-build-result.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$patch_exit" -eq 0 ]; then
            git add .github/workflows/build-haven-android.yml
            message="Enable versioned API 36 Haven Mobile APK build [skip ci]"
          else
            git add -f artifacts/android/enable-build-result.txt
            message="Record Haven Mobile build enablement failure [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push
          fi
          test "$hash_exit" = 0
          test "$compile_exit" = 0
          test "$patch_exit" = 0
