name: Apply beta chat orchestration

on:
  push:
    branches: [gpt/new-haven-beta-pass]
    paths:
      - scripts/apply_beta_chat_patch.py
      - .github/workflows/apply-beta-chat-orchestration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply validated beta chat orchestration') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/new-haven-beta-pass
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Repair stale anchors and compile blockers
        shell: pwsh
        run: |
          $tracker = 'src/Haven.Application/ChatExecutionTracker.cs'
          $text = Get-Content $tracker -Raw
          $text = $text.Replace('return ValueTask.CompletedTask;', 'return default;')
          Set-Content $tracker $text -Encoding utf8

          $cache = 'src/Haven.Application/ModelInventoryCache.cs'
          $text = Get-Content $cache -Raw
          $text = $text.Replace('!ReferenceEquals.Equals(_current, tracker)', '!ReferenceEquals(_current, tracker)')
          $text = $text.Replace('_current.Changed -= OnTrackerChanged;', '_current!.Changed -= OnTrackerChanged;')
          Set-Content $cache $text -Encoding utf8

          $patch = 'scripts/apply_beta_chat_patch.py'
          $text = Get-Content $patch -Raw
          $text = $text.Replace(
            '    private static WorkspaceToolResult UnavailableToolResult(',
            '    private ToolAvailabilityPlan CreateAvailabilityPlan(')
          Set-Content $patch $text -Encoding utf8

      - name: Apply Chat orchestration patch
        shell: pwsh
        run: python scripts/apply_beta_chat_patch.py

      - name: Restore
        run: dotnet restore Haven.sln

      - name: Build
        run: dotnet build Haven.sln -c Release --no-restore

      - name: Test
        run: dotnet test Haven.sln -c Release --no-build

      - name: Commit validated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply validated beta chat orchestration"
            git push origin HEAD:gpt/new-haven-beta-pass
          }
