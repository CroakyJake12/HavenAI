name: Apply beta chat orchestration

on:
  push:
    branches: [gpt/new-haven-beta-pass]
    paths:
      - scripts/apply_beta_chat_patch.py
      - .github/workflows/apply-beta-chat-orchestration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply validated beta chat orchestration') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/new-haven-beta-pass
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/beta-chat | Out-Null
          python scripts/apply_beta_chat_patch.py 2>&1 | Tee-Object artifacts/beta-chat/PATCH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore
        id: restore
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Haven.sln 2>&1 | Tee-Object artifacts/beta-chat/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Haven.sln -c Release --no-restore 2>&1 | Tee-Object artifacts/beta-chat/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        id: test
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test Haven.sln -c Release --no-build --logger "trx;LogFileName=beta-chat.trx" 2>&1 | Tee-Object artifacts/beta-chat/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write validation
        if: always()
        shell: pwsh
        run: |
          @(
            "# Beta Chat orchestration validation",
            "",
            "| Stage | Result |",
            "|---|---|",
            "| Patch | ${{ steps.patch.outcome }} |",
            "| Restore | ${{ steps.restore.outcome }} |",
            "| Build | ${{ steps.build.outcome }} |",
            "| Test | ${{ steps.test.outcome }} |"
          ) | Set-Content artifacts/beta-chat/VALIDATION.md
      - name: Commit results
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts artifacts/beta-chat
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply validated beta chat orchestration"
            git push origin HEAD:gpt/new-haven-beta-pass
          }
      - name: Fail on validation error
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            "${{ steps.patch.outcome }}",
            "${{ steps.restore.outcome }}",
            "${{ steps.build.outcome }}",
            "${{ steps.test.outcome }}"
          )
          if ($outcomes -contains "failure") { exit 1 }
