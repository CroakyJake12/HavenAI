name: Resolve PR 13 conflicts v3

on:
  push:
    branches:
      - gpt/diagnose-pr13-conflicts
    paths:
      - .github/workflows/resolve-pr13-conflicts-v3.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/haven-mobile-repair-android
          fetch-depth: 0

      - name: Merge main with selective resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          repair_head="$(git rev-parse HEAD)"

          set +e
          git merge --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            git push origin HEAD:gpt/haven-mobile-repair-android
            exit 0
          fi

          chat="src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml"

          echo "Unmerged paths before resolution:"
          git diff --name-status --diff-filter=U

          git checkout --theirs -- "$chat"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml")
          text = path.read_text(encoding="utf-8")

          source = 'HorizontalAlignment="Center" ColumnDefinitions="Auto,640,Auto" ColumnSpacing="10"'
          target = 'HorizontalAlignment="Stretch" MaxWidth="780" ColumnDefinitions="Auto,*,Auto" ColumnSpacing="10"'
          if text.count(source) != 1:
              raise SystemExit(f"Expected one fixed composer definition, found {text.count(source)}")
          text = text.replace(source, target, 1)

          source = 'Grid.Column="1"\n\t\t\t\t\t\t MinHeight="58" MaxHeight="150"'
          target = 'Grid.Column="1"\n\t\t\t\t\t\t MinWidth="0" MinHeight="58" MaxHeight="150"'
          if text.count(source) != 1:
              raise SystemExit(f"Expected one instruction-box definition, found {text.count(source)}")
          text = text.replace(source, target, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git checkout "$repair_head" --             src/Haven.Desktop/Views/Shell/MainView.axaml             src/Haven.Desktop/Views/Shell/MainView.axaml.cs             src/Haven.Desktop/Views/Shell/MainView.BetaOverlays.cs             src/Haven.Desktop/Views/Shell/MainView.NativeChatSidebar.cs

          git add "$chat"             src/Haven.Desktop/Views/Shell/MainView.axaml             src/Haven.Desktop/Views/Shell/MainView.axaml.cs             src/Haven.Desktop/Views/Shell/MainView.BetaOverlays.cs             src/Haven.Desktop/Views/Shell/MainView.NativeChatSidebar.cs

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unexpected unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- "$chat"               src/Haven.Desktop/Views/Shell/MainView.axaml               src/Haven.Desktop/Views/Shell/MainView.axaml.cs; then
            echo "Conflict markers remain."
            exit 1
          fi

          git commit -m "Merge main and resolve mobile repair conflicts"
          git push origin HEAD:gpt/haven-mobile-repair-android
