name: Haven Mobile Repair Android

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths-ignore:
      - 'artifacts/android/**'
      - 'artifacts/android-smoke/**'

permissions:
  contents: write

concurrency:
  group: haven-mobile-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PROJECT: src/Haven.Android/Haven.Android.csproj
  ANDROID_TFM: net10.0-android
  ANDROID_CONFIGURATION: Debug
  EVIDENCE_DIR: artifacts/android

jobs:
  build:
    name: Compile and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_ready: ${{ steps.outcome.outputs.apk_ready }}
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Check out repaired source
        uses: actions/checkout@v6

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "input_commit=${GITHUB_SHA}"
          } > "$EVIDENCE_DIR/build-result.txt"

      - name: Install .NET from global.json
        id: dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Record .NET environment
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "setup_dotnet_outcome=${{ steps.dotnet.outcome }}"
            dotnet --info
            echo
            dotnet nuget list source --configfile NuGet.Config
          } 2>&1 | tee "$EVIDENCE_DIR/environment.log"
          exit 0

      - name: Install Android workload
        id: workload
        if: steps.dotnet.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet workload install android 2>&1 | tee "$EVIDENCE_DIR/workload.log"
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Restore Android project
        id: restore
        if: steps.workload.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet restore "$ANDROID_PROJECT" \
            --configfile NuGet.Config \
            --verbosity normal 2>&1 | tee "$EVIDENCE_DIR/restore.log"
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Compile Android project
        id: compile
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build "$ANDROID_PROJECT" \
            --configuration "$ANDROID_CONFIGURATION" \
            --framework "$ANDROID_TFM" \
            --no-restore 2>&1 | tee "$EVIDENCE_DIR/build.log"
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Package installable APK
        id: package
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet publish "$ANDROID_PROJECT" \
            --configuration "$ANDROID_CONFIGURATION" \
            --framework "$ANDROID_TFM" \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee "$EVIDENCE_DIR/publish.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -eq 0 ]; then
            mapfile -t apks < <(find src/Haven.Android/bin -type f -name '*.apk' | sort)
            if [ "${apks[@]}" -eq 0 ]; then
              echo "No APK was produced." | tee -a "$EVIDENCE_DIR/publish.log"
              result=1
            else
              for apk in "${apks[@]}"; do
                cp "$apk" "$EVIDENCE_DIR/$(basename "$apk")"
              done
              sha256sum "$EVIDENCE_DIR"/*.apk | tee "$EVIDENCE_DIR/SHA256SUMS.txt"
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Summarize build result
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "setup_dotnet_outcome=${{ steps.dotnet.outcome }}"
            echo "workload_outcome=${{ steps.workload.outcome }}"
            echo "workload_exit=${{ steps.workload.outputs.result }}"
            echo "restore_outcome=${{ steps.restore.outcome }}"
            echo "restore_exit=${{ steps.restore.outputs.result }}"
            echo "compile_outcome=${{ steps.compile.outcome }}"
            echo "compile_exit=${{ steps.compile.outputs.result }}"
            echo "package_outcome=${{ steps.package.outcome }}"
            echo "package_exit=${{ steps.package.outputs.result }}"
            echo
            echo "compiler_diagnostics:"
            grep -hE -m 400 '(^|[ :])(error|warning) (CS|MSB|NETSDK|NU|XA|APT)+[0-9]+' \
              "$EVIDENCE_DIR"/*.log 2>/dev/null || true
          } >> "$EVIDENCE_DIR/build-result.txt"
          cat "$EVIDENCE_DIR/build-result.txt"

      - name: Upload build evidence and APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

      - name: Persist concise build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/build-result.txt
          if [ -f artifacts/android/SHA256SUMS.txt ]; then
            git add -f artifacts/android/SHA256SUMS.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Haven Android build evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Determine build outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.dotnet.outcome }}" = "success" ] \
            && [ "${{ steps.workload.outcome }}" = "success" ] \
            && [ "${{ steps.restore.outcome }}" = "success" ] \
            && [ "${{ steps.compile.outcome }}" = "success" ]  \
            && [ "${{ steps.package.outcome }}" = "success" ]; then
            echo "apk_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apk_ready=false" >> "$GITHUB_OUTPUT"
          exit 1

  smoke:
    name: Android API 36 emulator smoke
    needs: build
    if: needs.build.outputs.apk_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Haven Android smoke test
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a42131c6e42959945e0b5c8d68f6b1c2b7a4a0c9
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            export HAVEN_APK="$(find artifacts/android -type f -name '*.apk' | head -n 1)"
            bash .github/scripts/haven-android-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Smoke-${{ github.run_id }}
          path: |
            artifacts/android-smoke/
            artifacts/android/*.png
            artifacts/android/*.xml
            artifacts/android/*.txt
            artifacts/android/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce smoke result
        if: always()
        shell: bash
        run: test "${{ steps.smoke.outcome }}" = "success"
