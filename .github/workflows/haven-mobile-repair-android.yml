name: Haven Mobile Repair Android

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths-ignore:
      - 'artifacts/android/**'
      - 'artifacts/android-smoke/**'

permissions:
  contents: write

concurrency:
  group: haven-mobile-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PROJECT: src/Haven.Android/Haven.Android.csproj
  ANDROID_TFM: net10.0-android
  ANDROID_CONFIGURATION: Debug
  EVIDENCE_DIR: artifacts/android

jobs:
  build:
    name: Repair, compile, and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_ready: ${{ steps.outcome.outputs.apk_ready }}
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6

      - name: Prepare clean evidence directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "input_commit=${GITHUB_SHA}"
          } > "$EVIDENCE_DIR/build-result.txt"

      - name: Apply deterministic source repairs
        id: patch
        shell: bash
        run: |
          set +e
          payload="scripts/apply_haven_android_compile_repairs.py.gz"
          {
            echo "payload_size=$(wc -c < "$payload")"
            sha256sum "$payload"
          } | tee "$EVIDENCE_DIR/repair-gate.log"

          echo "b4029306001c39490dbef2adf746cae865e0d66e9f21e44e9a9029615f8145de  $payload" \
            | sha256sum --check - 2>&1 | tee -a "$EVIDENCE_DIR/repair-gate.log"
          result=${PIPESTATUS[1]}

          if [ "$result" -eq 0 ]; then
            gzip -dc "$payload" > /tmp/haven-android-compile-repairs.py 2>> "$EVIDENCE_DIR/repair-gate.log"
            result=$?
          fi

          if [ "$result" -eq 0 ]; then
            sed -i 's#ROOT = Path(__file__).resolve().parents\[1\]#ROOT = Path.cwd()#' /tmp/haven-android-compile-repairs.py
            result=$?
          fi

          if [ "$result" -eq 0 ]; then
            echo "a6a7734d01e164fc8cccab412579177fda1f7b5329f904277dc5a2dfe5c77887  /tmp/haven-android-compile-repairs.py" \
              | sha256sum --check - 2>&1 | tee -a "$EVIDENCE_DIR/repair-gate.log"
            result=${PIPESTATUS[1]}
          fi

          if [ "$result" -eq 0 ]; then
            python3 -m py_compile /tmp/haven-android-compile-repairs.py 2>&1 \
              | tee -a "$EVIDENCE_DIR/repair-gate.log"
            result=${PIPESTATUS[0]}
          fi

          if [ "$result" -eq 0 ]; then
            python3 /tmp/haven-android-compile-repairs.py 2>&1 \
              | tee "$EVIDENCE_DIR/api-repair.log"
            result=${PIPESTATUS[0]}
          fi

          if [ "$result" -eq 0 ]; then
            python3 scripts/apply_haven_mobile_repair.py 2>&1 \
              | tee "$EVIDENCE_DIR/shared-repair.log"
            result=${PIPESTATUS[0]}
          fi

          if [ "$result" -eq 0 ]; then
            git diff --check 2>&1 | tee "$EVIDENCE_DIR/diff-check.log"
            result=${PIPESTATUS[0]}
          fi

          echo "patch_exit=$result" | tee -a "$EVIDENCE_DIR/build-result.txt"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repaired source
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Haven.Android/ModelImportActivity.cs \
            src/Haven.Android/HavenLauncherActivity.cs \
            src/Haven.Android/HavenLauncherActivity.Apps.cs \
            src/Haven.Android/HavenLauncherActivity.Settings.cs \
            src/Haven.Android/MainView.Mobile.Layout.cs \
            src/Haven.Browser/BrowserPrivateProfileManager.cs \
            src/Haven.Desktop/Views/Shell/MainView.cs \
            src/Haven.Desktop/Views/Shell/MainView.Mobile.Layout.cs \
            src/Haven.Desktop/Views/Chat/ChatPageView.cs
          if ! git diff --cached --quiet; then
            git commit -m "Apply Haven Android compiler repairs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install .NET SDK
        if: steps.patch.outputs.result == '0'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Record environment
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set +e
          {
            dotnet --info
            echo
            dotnet nuget list source --configfile NuGet.Config
          } 2>&1 | tee "$EVIDENCE_DIR/environment.log"
          exit 0

      - name: Restore workload and compile APK
        id: compile
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set +e
          workload=99
          restore=99
          build=99
          package=99

          dotnet workload install android 2>&1 \
            | tee "$EVIDENCE_DIR/workload.log"
          workload=${PIPESTATUS[0]}

          if [ "$workload" -eq 0 ]; then
            dotnet restore "$ANDROID_PROJECT" \
              --configfile NuGet.Config \
              --verbosity normal 2>&1 | tee "$EVIDENCE_DIR/restore.log"
            restore=${PIPESTATUS[0]}
          fi

          if [ "$restore" -eq 0 ]; then
            dotnet build "$ANDROID_PROJECT" \
              --configuration "$ANDROID_CONFIGURATION" \
              --framework "$ANDROID_TFM" \
              --no-restore 2>&1 | tee "$EVIDENCE_DIR/build.log"
            build=${PIPESTATUS[0]}
          fi

          if [ "$build" -eq 0 ]; then
            dotnet publish "$ANDROID_PROJECT" \
              --configuration "$ANDROID_CONFIGURATION" \
              --framework "$ANDROID_TFM" \
              --no-restore \
              -p:AndroidPackageFormat=apk \
              -p:AndroidKeyStore=false 2>&1 | tee "$EVIDENCE_DIR/publish.log"
            package=${PIPESTATUS[0]}
          fi

          {
            echo "workload_exit=$workload"
            echo "restore_exit=$restore"
            echo "build_exit=$build"
            echo "package_exit=$package"
          } | tee -a "$EVIDENCE_DIR/build-result.txt"

          if [ "$package" -eq 0 ]; then
            mapfile -t apks < <(find src/Haven.Android/bin -type f -name '*.apk' | sort)
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "No APK was produced." | tee -a "$EVIDENCE_DIR/build-result.txt"
              package=1
            else
              for apk in "${apks[@]}"; do
                cp "$apk" "$EVIDENCE_DIR/$(basename "$apk")"
              done
              sha256sum "$EVIDENCE_DIR"/*.apk | tee "$EVIDENCE_DIR/SHA256SUMS.txt"
            fi
          fi

          echo "result=$package" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo
            echo "patch_diagnostics:"
            tail -n 120 "$EVIDENCE_DIR/repair-gate.log" 2>/dev/null || true
            tail -n 120 "$EVIDENCE_DIR/api-repair.log" 2>/dev/null || true
            tail -n 120 "$EVIDENCE_DIR/shared-repair.log" 2>/dev/null || true
            echo
            echo "compiler_diagnostics:"
            grep -hE -m 400 '(^|[ :])(error|warning) (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' \
              "$EVIDENCE_DIR"/*.log 2>/dev/null || true
          } >> "$EVIDENCE_DIR/build-result.txt"
          cat "$EVIDENCE_DIR/build-result.txt"

      - name: Upload build evidence and APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

      - name: Persist concise build evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/build-result.txt
          if [ -f artifacts/android/SHA256SUMS.txt ]; then
            git add -f artifacts/android/SHA256SUMS.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Haven Android build evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Determine build outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          patch="${{ steps.patch.outputs.result }}"
          compile="${{ steps.compile.outputs.result }}"
          if [ "$patch" = "0" ] && [ "$compile" = "0" ]; then
            echo "apk_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apk_ready=false" >> "$GITHUB_OUTPUT"
          exit 1

  smoke:
    name: Android API 36 emulator smoke
    needs: build
    if: needs.build.outputs.apk_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Haven Android smoke test
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a42131c6e42959945e0b5c8d68f6b1c2b7a4a0c9
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            export HAVEN_APK="$(find artifacts/android -type f -name '*.apk' | head -n 1)"
            bash .github/scripts/haven-android-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Smoke-${{ github.run_id }}
          path: |
            artifacts/android-smoke/
            artifacts/android/*.png
            artifacts/android/*.xml
            artifacts/android/*.txt
            artifacts/android/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce smoke result
        if: always()
        shell: bash
        run: test "${{ steps.smoke.outcome }}" = "success"

# Align GitHub Actions with the repository's supported Android build workflow.
