name: Haven Mobile Repair Android

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths-ignore:
      - 'artifacts/android/**'

permissions:
  contents: write

concurrency:
  group: haven-mobile-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PROJECT: src/Haven.Android/Haven.Android.csproj
  ANDROID_TFM: net10.0-android
  ANDROID_CONFIGURATION: Debug
  ANDROID_ARTIFACT_DIR: artifacts/android

jobs:
  build:
    name: Repair, compile, and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_ready: ${{ steps.final.outputs.apk_ready }}
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_ARTIFACT_DIR"
          mkdir -p "$ANDROID_ARTIFACT_DIR"
          {
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "input_commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
          } > "$ANDROID_ARTIFACT_DIR/build-result.txt"

      - name: Apply deterministic Android source repairs
        id: patch
        shell: bash
        run: |
          set +e
          base64 --decode scripts/apply_haven_android_api_repairs.py.gz.b64 > /tmp/haven-android-repairs.py.gz
          payload_result=$?
          if [ "$payload_result" -eq 0 ]; then
            echo "bd5faf0775dfc8d22df0f2116a2aba53af21d58002e6f293b89725b72fbb0644  /tmp/haven-android-repairs.py.gz" | sha256sum --check -
            payload_result=$?
          fi
          if [ "$payload_result" -eq 0 ]; then
            gzip --decompress --stdout /tmp/haven-android-repairs.py.gz > /tmp/haven-android-repairs.py
            payload_result=$?
          fi
          if [ "$payload_result" -eq 0 ]; then
            echo "7ac3440f80ac3b42814325fa510229203ba51d7f2e0a0dd7e6efd8769efd674a  /tmp/haven-android-repairs.py" | sha256sum --check -
            payload_result=$?
          fi
          if [ "$payload_result" -eq 0 ]; then
            python3 -m py_compile /tmp/haven-android-repairs.py
            payload_result=$?
          fi
          if [ "$payload_result" -eq 0 ]; then
            python3 /tmp/haven-android-repairs.py 2>&1 | tee "$ANDROID_ARTIFACT_DIR/api-repair.log"
            payload_result=${PIPESTATUS[0]}
          fi
          if [ "$payload_result" -eq 0 ]; then
            python3 scripts/apply_haven_mobile_repair.py 2>&1 | tee "$ANDROID_ARTIFACT_DIR/shared-repair.log"
            payload_result=${PIPESTATUS[0]}
          fi
          if [ "$payload_result" -eq 0 ]; then
            git diff --check 2>&1 | tee "$ANDROID_ARTIFACT_DIR/diff-check.log"
            payload_result=${PIPESTATUS[0]}
          fi
          echo "patch_exit=${payload_result}" | tee -a "$ANDROID_ARTIFACT_DIR/build-result.txt"
          echo "result=${payload_result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repaired source
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Haven.Android/ModelImportActivity.cs \
            src/Haven.Android/HavenLauncherActivity.cs \
            src/Haven.Android/HavenLauncherActivity.Apps.cs \
            src/Haven.Android/HavenLauncherActivity.Settings.cs \
            src/Haven.Android/MainView.Mobile.Layout.cs \
            src/Haven.Browser/BrowserPrivateProfileManager.cs \
            src/Haven.Desktop/Views/Shell/MainView.cs \
            src/Haven.Desktop/Views/Shell/MainView.Mobile.Layout.cs \
            src/Haven.Desktop/Views/Chat/ChatPageView.cs
          if ! git diff --cached --quiet; then
            git commit -m "Apply Haven Android compiler repairs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install .NET from global.json
        if: steps.patch.outputs.result == '0'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Record .NET and NuGet environment
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set +e
          {
            dotnet --info
            echo
            dotnet nuget list source --configfile NuGet.Config
          } 2>&1 | tee "$ANDROID_ARTIFACT_DIR/environment.log"
          exit 0

      - name: Install Android workload
        id: workload
        if: steps.patch.outputs.result == '0'
        shell: bash
        run: |
          set +e
          dotnet workload install android 2>&1 | tee "$ANDROID_ARTIFACT_DIR/workload.log"
          result=${PIPESTATUS[0]}
          echo "workload_exit=${result}" | tee -a "$ANDROID_ARTIFACT_DIR/build-result.txt"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore Android project
        id: restore
        if: steps.patch.outputs.result == '0' && steps.workload.outputs.result == '0'
        shell: bash
        run: |
          set +e
          dotnet restore "$ANDROID_PROJECT" \
            --configfile NuGet.Config \
            --verbosity normal 2>&1 | tee "$ANDROID_ARTIFACT_DIR/restore.log"
          result=${PIPESTATUS[0]}
          echo "restore_exit=${result}" | tee -a "$ANDROID_ARTIFACT_DIR/build-result.txt"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile Android project
        id: compile
        if: steps.restore.outputs.result == '0'
        shell: bash
        run: |
          set +e
          dotnet build "$ANDROID_PROJECT" \
            --configuration "$ANDROID_CONFIGURATION" \
            --framework "$ANDROID_TFM" \
            --no-restore 2>&1 | tee "$ANDROID_ARTIFACT_DIR/build.log"
          result=${PIPESTATUS[0]}
          echo "build_exit=${result}" | tee -a "$ANDROID_ARTIFACT_DIR/build-result.txt"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package installable APK
        id: package
        if: steps.compile.outputs.result == '0'
        shell: bash
        run: |
          set +e
          dotnet publish "$ANDROID_PROJECT" \
            --configuration "$ANDROID_CONFIGURATION" \
            --framework "$ANDROID_TFM" \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee "$ANDROID_ARTIFACT_DIR/publish.log"
          result=${PIPESTATUSW0]}
          if [ "$result" -eq 0 ]; then
            mapfile -t apks < <(find src/Haven.Android/bin -type f -name '*.apk' | sort)
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "No APK was produced." | tee -a "$ANDROID_ARTIFACT_DIR/publish.log"
              result=1
            else
              for apk in "${apks[@]}"; do
                cp "$apk" "$ANDROID_ARTIFACT_DIR/$(basename "$apk")"
              done
              sha256sum "$ANDROID_ARTIFACT_DIR"/*.apk | tee "$ANDROID_ARTIFACT_DIR/SHA256SUMS.txt"
            fi
          fi
          echo "package_exit=${result}" | tee -a "$ANDROID_ARTIFACT_DIR/build-result.txt"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize compiler diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo
            echo "patch_diagnostics:"
            tail -n 80 "$ANDROID_ARTIFACT_DIR/api-repair.log" 2>/dev/null || true
            tail -n 80 "$ANDROID_ARTIFACT_DIR/shared-repair.log" 2>/dev/null || true
            echo
            echo "compiler_diagnostics:"
            grep -hE -m 300 '(^|[ :])(error|warning) (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' \
              "$ANDROID_ARTIFACT_DIR"/*.log 2>/dev/null || true
          } >> "$ANDROID_ARTIFACT_DIR/build-result.txt"
          cat "$ANDROID_ARTIFACT_DIR/build-result.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

      - name: Persist build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/build-result.txt
          if [ -f artifacts/android/SHA256SUMS.txt ]; then
            git add -f artifacts/android/SHA256SUMS.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Haven Android build evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Determine final build outcome
        id: final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          patch="${{ steps.patch.outputs.result }}"
          workload="${{ steps.workload.outputs.result }}"
          restore="${{ steps.restore.outputs.result }}"
          compile="${{ steps.compile.outputs.result }}"
          package="${{ steps.package.outputs.result }}"
          if [ "$patch" = "0" ] && [ "$workload" = "0" ] && [ "$restore" = "0" ] && [ "$compile" = "0" ] && [ "$package" = "0" ]; then
            echo "apk_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apk_ready=false" >> "$GITHUB_OUTPUT"
          exit 1

  smoke:
    name: Android emulator smoke
    needs: build
    if: needs.build.outputs.apk_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Haven-Mobile-Repair-Build-${{ github.run_id }}
          path: artifacts/android

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Haven Android smoke test
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a42131c6e42959945e0b5c8d68f6b1c2b7a4a0c9
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            export HAVEN_APK="$(find artifacts/android -type f -name '*.apk' | head -n 1)"
            bash .github/scripts/haven-android-smoke.sh

      - name: Record smoke outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-smoke
          {
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "smoke_outcome=${{ steps.smoke.outcome }}"
          } > artifacts/android-smoke/smoke-result.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Repair-Smoke-${{ github.run_id }}
          path: |
            artifacts/android-smoke/
            artifacts/android/*.png
            artifacts/android/*.xml
            artifacts/android/*.txt
            artifacts/android/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce smoke result
        if: always()
        shell: bash
        run: |
          test "${{ steps.smoke.outcome }}" = "success"
