name: Mobile Composition Smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/mobile-composition-smoke.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Haven-6420be22-Mobile-APK
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31172963682

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch Haven
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save
          script: |
            smoke="$GITHUB_WORKSPACE/smoke"
            apk="$GITHUB_WORKSPACE/artifact/Haven-Mobile-Composition.apk"
            mkdir -p "$smoke"
            echo entered > "$smoke/emulator-script-started.txt"
            ls -la "$GITHUB_WORKSPACE/artifact" > "$smoke/artifact-ls.txt" 2>&1
            sha256sum "$apk" > "$smoke/apk-sha256.txt" 2>&1
            test -s "$apk"
            adb devices -l > "$smoke/adb-devices.txt" 2>&1
            adb install -r "$apk" > "$smoke/install.txt" 2>&1
            adb logcat -c
            adb shell monkey -p com.cakemods.haven -c android.intent.category.LAUNCHER 1 > "$smoke/launch.txt" 2>&1
            sleep 12
            adb shell pidof com.cakemods.haven > "$smoke/pid.txt" 2>&1
            test -s "$smoke/pid.txt"
            adb shell dumpsys activity activities > "$smoke/activities.txt" 2>&1
            grep -F com.cakemods.haven "$smoke/activities.txt" >/dev/null
            adb logcat -d -t 1500 > "$smoke/logcat.txt" 2>&1
            adb exec-out screencap -p > "$smoke/launched.png"
            test -s "$smoke/launched.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haven-6420be22-Mobile-Smoke-Direct
          path: smoke
          if-no-files-found: warn
          retention-days: 30
