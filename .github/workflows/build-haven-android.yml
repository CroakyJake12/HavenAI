name: Build Haven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - haven-android-cloud-build

permissions:
  contents: read

concurrency:
  group: haven-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out Haven
        uses: "actions/checkout@v6"

      - name: Install .NET from global.json
        uses: "actions/setup-dotnet@v6"
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android head
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Compile Android head
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore 2>&1 | tee artifacts/android/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E -m 30 '(^|[ :])error (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' artifacts/android/build.log |
              while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/'%0D'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error title=Android compiler::$safe"
              done
          fi
          exit "$result"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee artifacts/android/publish.log

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android/$(basename "$apk")"
          done
          sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt

      - name: Upload build logs
        if: always()
        uses: "actions/upload-artifact@v7"
        with:
          name: Haven-Android-Build-Logs
          path: artifacts/android/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installable APK
        uses: "actions/upload-artifact@v7"
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Install and launch APK on hosted emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AVD_NAME: haven-ci
      ANDROID_SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64

    steps:
      - name: Download APK artifact
        uses: "actions/download-artifact@v8"
        with:
          name: Haven-Android-APK
          path: artifacts/android

      - name: Create and boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke

          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          avdmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/avdmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          test -x "$avdmanager_path"

          yes | "$sdkmanager_path" --licenses >/dev/null || true
          timeout 900 "$sdkmanager_path" "platform-tools" "emulator" "$ANDROID_SYSTEM_IMAGE"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/platform-tools/adb"
          adb version | tee artifacts/smoke/adb-version.txt
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee artifacts/smoke/accel-check.txt || true

          echo no | "$avdmanager_path" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$ANDROID_SYSTEM_IMAGE" \
            --device "pixel_6"

          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" "@$AVD_NAME" \
            -no-window \
            -no-audio \
             -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            -camera-back none \
            -camera-front none \
            > artifacts/smoke/emulator.log 2>&1 &
          echo "$!" > artifacts/smoke/emulator.pid

          adb start-server
          if ! timeout 180 adb wait-for-device; then
            adb devices -l | tee artifacts/smoke/adb-devices.txt || true
            cat artifacts/smoke/emulator.log || true
            echo "::error title=Android emulator boot::ADB did not detect the emulator within 180 seconds."
            exit 1
          fi

          if ! timeout 240 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '; then
            adb devices -l | tee artifacts/smoke/adb-devices.txt || true
            adb shell getprop > artifacts/smoke/device-properties-partial.txt || true
            cat artifacts/smoke/emulator.log || true
            echo "::error title=Android emulator boot::The emulator was detected but did not finish booting within 240 seconds."
            exit 1
          fi

          adb shell input keyevent 82 || true
          adb devices -l | tee artifacts/smoke/adb-devices.txt
          adb shell getprop > artifacts/smoke/device-properties.txt

      - name: Install and launch Haven
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find artifacts/android -type f -name '*-Signed.apk' -print -quit)"
          if [ -z "$apk" ]; then
            apk="$(find artifacts/android -type f -name '*.apk' | sort | head -n 1)"
          fi
          test -n "$apk"

          sha256sum "$apk" | tee artifacts/smoke/installed-apk.sha256
          adb install -r "$apk" | tee artifacts/smoke/adb-install.txt
          adb shell pm list packages | grep -F 'package:com.cakemods.haven' |
            tee artifacts/smoke/package-presence.txt

          component="$(
            adb shell cmd package resolve-activity --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              com.cakemods.haven |
              tr -d '\r' |
              tail -n 1
          )"
          test -n "$component"
          test "$component" != "No activity found"
          printf '%s\n' "$component" | tee artifacts/smoke/launcher-component.txt

          adb logcat -c
          adb shell am force-stop com.cakemods.haven
          adb shell am start -W -n "$component" | tee artifacts/smoke/activity-start.txt
          sleep 30

          pid="$(adb shell pidof com.cakemods.haven | tr -d '\r')"
          test -n "$pid"
          printf '%s\n' "$pid" | tee artifacts/smoke/haven.pid

          adb shell dumpsys activity activities > artifacts/smoke/activities.txt
          adb shell dumpsys package com.cakemods.haven > artifacts/smoke/package.txt
          adb exec-out screencap -p > artifacts/smoke/haven-launch.png
          timeout 30 adb shell uiautomator dump /sdcard/haven-window.xml || true
          adb pull /sdcard/haven-window.xml artifacts/smoke/haven-window.xml || true
          adb logcat -d -v threadtime > artifacts/smoke/logcat.txt

          if grep -q 'FATAL EXCEPTION' artifacts/smoke/logcat.txt &&
            grep -q 'Process: com.cakemods.haven' artifacts/smoke/logcat.txt; then
            echo "::error title=Haven Android runtime::Haven emitted a fatal exception after launch."
            exit 1
          fi

          adb shell pidof com.cakemods.haven >/dev/null

      - name: Upload emulator smoke evidence
        if: always()
        uses: "actions/upload-artifact@v7"
        with:
          name: Haven-Android-Smoke-Evidence
          path: artifacts/smoke
          if-no-files-found: error
          retention-days: 30

      - name: Stop emulator
        if: always()
        shell: bash
        run: adb emu kill || true
