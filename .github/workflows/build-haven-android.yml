name: Build Haven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - haven-android-cloud-build
      - gpt/haven-mobile-repair-android

permissions:
  contents: read

concurrency:
  group: haven-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HAVEN_ANDROID_KEYSTORE_B64: ${{ secrets.HAVEN_ANDROID_KEYSTORE_B64 }}
      HAVEN_ANDROID_KEY_ALIAS: ${{ secrets.HAVEN_ANDROID_KEY_ALIAS }}
      HAVEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAVEN_ANDROID_KEYSTORE_PASSWORD }}
      HAVEN_ANDROID_KEY_PASSWORD: ${{ secrets.HAVEN_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out Haven
        uses: actions/checkout@v6

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Calculate Android version and signing mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          app_version=$((300000 + GITHUB_RUN_NUMBER))
          display_version="0.3.${GITHUB_RUN_NUMBER}-mobile-preview"
          signing_mode="ephemeral-debug"
          signing_args="-p:AndroidKeyStore=false"

          if [ -n "${HAVEN_ANDROID_KEYSTORE_B64:-}" ] \
             && [ -n "${HAVEN_ANDROID_KEY_ALIAS:-}" ] \
             && [ -n "${HAVEN_ANDROID_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${HAVEN_ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$HAVEN_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/haven-mobile.keystore"
            chmod 600 "$RUNNER_TEMP/haven-mobile.keystore"
            signing_mode="persistent-secret-keystore"
            signing_args="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/haven-mobile.keystore -p:AndroidSigningKeyAlias=$HAVEN_ANDROID_KEY_ALIAS -p:AndroidSigningStorePass=env:HAVEN_ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:HAVEN_ANDROID_KEY_PASSWORD"
          fi

          {
            echo "APP_VERSION="$app_version""
            echo "DISPLAY_VERSION=$display_version"
            echo "SIGNING_MODE=$signing_mode"
            echo "SIGNING_ARGS=$signing_args"
          } >> "$GITHUB_ENV"

          {
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "application_version=$app_version"
            echo "display_version=$display_version"
            echo "signing_mode=$signing_mode"
          } > artifacts/android/build-metadata.txt

      - name: Restore Android head
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/Haven.Android/Haven.Android.csproj 2>&1 | tee artifacts/android/restore.log

      - name: Compile Android head
        shell: bash
        run: |
          set +e
          dotnet build src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            --no-restore \
            -p:ApplicationVersion="$APP_VERSION" \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            2>&1 | tee artifacts/android/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E -m 40 '(^|[ :])error (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' artifacts/android/build.log |
              while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/'%0D'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error title=Android compiler::$safe"
              done
          fi
          exit "$result"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          read -r -a signing_args <<< "$SIGNING_ARGS"
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationVersion="$APP_VERSION" \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            "${signing_args[@]}" 2>&1 | tee artifacts/android/publish.log

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android/$(basename "$apk")"
          done

          sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          primary_apk="$(find artifacts/android -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)"
          if [ -z "$primary_apk" ]; then
            primary_apk="$(find artifacts/android -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          fi
          "$aapt" dump badging "$primary_apk" | head -n 1 | tee artifacts/android/APK-METADATA.txt
          grep -F "versionCode='$APP_VERSION'" artifacts/android/APK-METADATA.txt
          grep -F "versionName='$DISPLAY_VERSION'" artifacts/android/APK-METADATA.txt

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$primary_apk" > artifacts/android/APK-CERTIFICATE.txt
          grep -E 'Signer #1 certificate SHA-256 digest:' artifacts/android/APK-CERTIFICATE.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-Build-Logs
          path: |
            artifacts/android/*.log
            artifacts/android/build-metadata.txt
            artifacts/android/APK-METADATA.txt
            artifacts/android/APK-CERTIFICATE.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
            artifacts/android/build-metadata.txt
            artifacts/android/APK-METADATA.txt
            artifacts/android/APK-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Install and launch APK on hosted API 36 emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out Haven
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Haven-Android-APK
          path: artifacts/android

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch Haven
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save
          script: sh .github/scripts/haven-android-smoke.sh

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-Smoke-Evidence
          path: artifacts/smoke
          if-no-files-found: error
          retention-days: 30
