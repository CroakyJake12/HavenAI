name: Build Haven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - haven-android-cloud-build

permissions:
  contents: read

concurrency:
  group: haven-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out Haven
        uses: actions/checkout@v6

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android head
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Compile Android head
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore 2>&1 | tee artifacts/android/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E -m 30 '(^|[ :])error (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' artifacts/android/build.log |
              while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/'%0D'}
                safe=${safe//$'\n'/'%0A'}
                echo "::error title=Android compiler::$safe"
              done
          fi
          exit "$result"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee artifacts/android/publish.log

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android/$(basename "$apk")"
          done
          sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-Build-Logs
          path: artifacts/android/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Install and launch APK on hosted emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Haven
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: Haven-Android-APK
          path: artifacts/android

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch Haven
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save
          script: |
            set -eu
            mkdir -p artifacts/smoke

            collect_evidence() {
              adb shell dumpsys activity activities > artifacts/smoke/activities.txt 2>&1 || true
              adb shell dumpsys package com.cakemods.haven > artifacts/smoke/package.txt 2>&1 || true
              adb logcat -d -v threadtime > artifacts/smoke/logcat.txt 2>&1 || true
              adb exec-out screencap -p > artifacts/smoke/haven-launch.png 2>/dev/null || true
              adb shell uiautomator dump /sdcard/haven-window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/haven-window.xml artifacts/smoke/haven-window.xml >/dev/null 2>&1 || true
              adb shell pidof com.cakemods.haven > artifacts/smoke/haven.pid 2>&1 || true
            }
            trap collect_evidence EXIT

            apk="$(find artifacts/android -type f -name '*5Signed.apk' -print -quit)"
            if [ -z "$apk" ]; then
              apk="$(find artifacts/android -type f -name '*.apk' | sort | head -n 1)"
            fi
            test -n "$apk"

            sha256sum "$apk" > artifacts/smoke/installed-apk.sha256
            cat artifacts/smoke/installed-apk.sha256

            adb install -r "$apk" > artifacts/smoke/adb-install.txt 2>&1
            cat artifacts/smoke/adb-install.txt
            grep -q '^Success$' artifacts/smoke/adb-install.txt

            adb shell pm list packages > artifacts/smoke/package-presence.txt
            grep -F 'package:com.cakemods.haven' artifacts/smoke/package-presence.txt

            component="$(
              adb shell cmd package resolve-activity --brief \
                -a android.intent.action.MAIN \
                -c android.intent.category.LAUNCHER \
                com.cakemods.haven |
              tr -d '\qÂ' |
              tail -n 1
            )"
            test -n "$component"
            test "$component" != "No activity found"
            printf '%s\n' "$component" > artifacts/smoke/launcher-component.txt
            cat artifacts/smoke/launcher-component.txt

            adb logcat -c
            adb shell am force-stop com.cakemods.haven
            adb shell am start -W -n "$component" > artifacts/smoke/activity-start.txt 2>&1
            cat artifacts/smoke/activity-start.txt
            sleep 30

            collect_evidence

            pid="$(tr -d '\qÂ\n' < artifacts/smoke/haven.pid)"
            if [ -z "$pid" ]; then
              echo "::error title=Haven Android runtime::Haven exited during startup."
              grep -E -A 40 -B 5 'FATAL EXCEPTION|AndroidRuntime|Haven Android runtime report' \
                artifacts/smoke/logcat.txt || true
              exit 1
            fi

            if grep -q 'Haven encountered an error' artifacts/smoke/haven-window.xml 2>/dev/null; then
              echo "::error title=Haven Android startup::The native recovery dialog reported an Avalonia startup failure."
              grep -E -A 60 -B 5 'Haven Android runtime report|FATAL EXCEPTION|AndroidRuntime' \
                artifacts/smoke/logcat.txt || true
              exit 1
            fi

            if grep -q 'FATAL EXCEPTION' artifacts/smoke/logcat.txt &&
               grep -q 'Process: com.cakemods.haven' artifacts/smoke/logcat.txt; then
              echo "::error title=Haven Android runtime::Haven emitted a fatal exception after launch."
              exit 1
            fi

            adb shell pidof com.cakemods.haven >/dev/null

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-Smoke-Evidence
          path: artifacts/smoke
          if-no-files-found: error
          retention-days: 30
