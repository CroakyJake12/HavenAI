name: Build Haven Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - haven-android-cloud-build
    paths:
      - "src/Haven.Android/**"
      - "src/Haven.Desktop/**"
      - "src/Haven.Core/**"
      - "src/Haven.Application/**"
      - "src/Haven.Infrastructure/**"
      - "src/Haven.Browser/**"
      - "src/Haven.Automations/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build-haven-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Compile and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out Haven
        uses: actions/checkout@v4

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android head
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Compile Android head
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Package APK
        run: >
          dotnet publish src/Haven.Android/Haven.Android.csproj
          -c Debug
          -f net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android/$(basename "$apk")"
          done
          sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-APK
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30
