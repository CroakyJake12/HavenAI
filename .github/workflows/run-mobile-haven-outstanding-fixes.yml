name: Run Mobile Haven outstanding fixes and APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-mobile-haven-outstanding-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: mobile-haven-outstanding-fixes

      - name: Apply outstanding mobile repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/Haven.Android/MainView.Mobile.Android.cs",
              "typeof(Haven.Android.ModelImportActivity)",
              "typeof(Haven.Android.ModelBrowserActivity)",
              "model browser launch")

          replace_once(
              "src/Haven.Android/MainView.Mobile.Interactions.cs",
              'if (string.Equals(surface, "dashboard", StringComparison.OrdinalIgnoreCase))\n'
              '        {\n'
              '            await OpenDashboardAsync();\n'
              '            return;\n'
              '        }',
              'if (string.Equals(surface, "dashboard", StringComparison.OrdinalIgnoreCase)\n'
              '            || string.Equals(surface, "home", StringComparison.OrdinalIgnoreCase)\n'
              '            || string.Equals(surface, "go", StringComparison.OrdinalIgnoreCase))\n'
              '        {\n'
              '            await OpenHomeAsync();\n'
              '            return;\n'
              '        }',
              "home routes to Go")

          interactions = Path("src/Haven.Android/MainView.Mobile.Interactions.cs")
          text = interactions.read_text()
          start = text.index("    private void RefreshMobileTabs()")
          end = text.index("    private void OpenMobileDrawer()", start)
          tabs = base64.b64decode("").decode()
          interactions.write_text(text[:start] + tabs + text[end:])

          layout = Path("src/Haven.Android/MainView.Mobile.Layout.cs")
          text = layout.read_text()
          home_block = (
              '        var home = MobileIconButton("home", () => _ = OpenHomeAsync(), "Go");\n'
              '        home.Background = ResourceBrush("HavenAccentSoftBrush");\n'
              '        home.BorderBrush = ResourceBrush("HavenAccentBorderBrush");\n'
              '        home.BorderThickness = new Thickness(1);\n')
          if text.count(home_block) != 1:
              raise SystemExit("standalone home button block was not found exactly once")
          text = text.replace(home_block, "", 1)
          text = text.replace(
              'ColumnDefinitions = new ColumnDefinitions("Auto,*"),\n'
              '            ColumnSpacing = 6,\n'
              '            Margin = new Thickness(6, 0, 6, 8),',
              'ColumnDefinitions = new ColumnDefinitions("*"),\n'
              '            Margin = new Thickness(8, 0, 8, 8),',
              1)
          text = text.replace(
              '        footer.Children.Add(home);\n'
              '        Grid.SetColumn(chatBar, 1);\n'
              '        footer.Children.Add(chatBar);',
              '        footer.Children.Add(chatBar);',
              1)
          text = text.replace(
              '            Padding = new Thickness(0, 7, 0, 0),',
              '            Padding = new Thickness(0, 7, 0, 8),',
              1)
          text = text.replace(
              '        var brand = MobileButton(ModelNameText.Text ?? _preferences.DefaultModel ?? "Model", "haven", ShowModelSelector, 10);',
              '        var brand = MobileButton(ModelNameText.Text ?? _preferences.DefaultModel ?? "Model", "haven", ShowModelSelector, 10);\n'
              '        ToolTip.SetTip(brand, "Switch model");',
              1)
          layout.write_text(text)

          launcher = Path("src/Haven.Android/HavenLauncherActivity.cs")
          text = launcher.read_text()
          text = text.replace(
              '        BuildSurface();\n        LoadAppsAsync();',
              '        BuildSurface();\n        _root?.Post(LoadAppsAsync);',
              1)
          text = text.replace(
              '        _root.SetPadding(Dp(12), Dp(10), Dp(12), Dp(10));\n'
              '        _root.SetOnTouchListener(',
              '        _root.SetPadding(Dp(12), Dp(10), Dp(12), Dp(10));\n'
              '        _root.Focusable = true;\n'
              '        _root.Clickable = true;\n'
              '        _root.SetOnTouchListener(',
              1)
          launcher.write_text(text)

          checks = {
              "model browser": "typeof(Haven.Android.ModelBrowserActivity)" in Path("src/Haven.Android/MainView.Mobile.Android.cs").read_text(),
              "Go routing": 'string.Equals(surface, "go"' in interactions.read_text(),
              "desktop-style tabs": "IconForSurface(tab.Surface)" not in interactions.read_text(),
              "floating-island controls preserved": 'MobileButton("New chat"' in layout.read_text() and 'MobileButton("New group"' in layout.read_text(),
              "standalone footer home removed": 'MobileIconButton("home"' not in layout.read_text(),
              "launcher reload posted": "_root?.Post(LoadAppsAsync);" in launcher.read_text(),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("validation failed: " + ", ".join(failed))
          print("Applied and validated source repairs:", ", ".join(checks))
          PY

      - name: Commit applied source repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source repairs already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Haven.Android/MainView.Mobile.Android.cs                     src/Haven.Android/MainView.Mobile.Interactions.cs                     src/Haven.Android/MainView.Mobile.Layout.cs                     src/Haven.Android/HavenLauncherActivity.cs
            git commit -m "Fix outstanding Mobile Haven shell issues"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj             -c Debug             -f net10.0-android             --no-restore             -p:AndroidPackageFormat=apk             -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
