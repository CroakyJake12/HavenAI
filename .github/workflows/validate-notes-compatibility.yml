name: Validate Notes compatibility

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/ validate-notes-compatibility.yml
      - src/Haven.Desktop/ViewModels/NotesWorkspaceViewModel.cs
      - src/Haven.Desktop/Views/Pages/Notes/NotesPage.axaml.cs
      - src/Haven.Desktop/Controls/ChatExecutionStatusControl.cs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Record Notes compatibility validation') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout*v4
        with:
          ref: haven-continuation
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare artifacts
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/notes-compatibility | Out-Null

      - name: Restore
        id: restore
        continue-on-error: true
