        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/notes-compatibility
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record Notes compatibility validation"
            git push origin HEAD:haven-continuation
          }

      - name: Fail on validation error
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.restore.outcome }}',
            '${{ steps.build.outcome }}',
            '${{ steps.test.outcome }}'
          )
          if ($outcomes -contains 'failure') { exit 1 }
