name: Apply continuation call backend
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/apply_continuation_call_backend.py
      - .github/workflows/apply-continuation-call-backend.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply validated call backend') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply source patch
        run: python scripts/apply_continuation_call_backend.py
      - name: Restore
        run: dotnet restore Haven.sln
      - name: Build
        run: dotnet build Haven.sln -c Release --no-restore
      - name: Focused tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/Haven.Infrastructure.Tests/Haven.Infrastructure.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ProviderRoutingRegistrationTests"
          dotnet test tests/Haven.Desktop.Tests/Haven.Desktop.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~CallSingletonIntegrationTests|FullyQualifiedName~CallVoicePreviewControllerTests|FullyQualifiedName~NotesDictationControllerTests|FullyQualifiedName~NotesReadAloudControllerTests"
      - name: Commit buildable backend
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/apply_continuation_call_backend.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply validated call backend"
            git push origin HEAD:haven-continuation
          }
