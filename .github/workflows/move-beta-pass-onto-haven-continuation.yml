name: Move beta pass onto haven-continuation

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/move-beta-pass-onto-haven-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message || '', 'Merge beta pass onto haven-continuation') }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out haven-continuation
        uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0

      - name: Merge beta pass and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gpt/new-haven-beta-pass
          git merge --no-ff --no-edit origin/gpt/new-haven-beta-pass -m "Merge beta pass onto haven-continuation"
          git push origin HEAD:haven-continuation
