name: Haven Continuation Validation

on:
  workflow_dispatch:
    inputs:
      upload_source_snapshot:
        description: Upload a short-lived source snapshot for diagnosis
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HAVEN_DATA_DIR: ${{ runner.temp }}\haven-validation-profile
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: haven-continuation

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Haven.sln

      - name: Build Debug
        run: dotnet build Haven.sln -c Debug --no-restore

      - name: Test Debug
        run: dotnet test Haven.sln -c Debug --no-build --logger "trx;LogFileName=haven-debug.trx"

      - name: Build Release
        run: dotnet build Haven.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test Haven.sln -c Release --no-build --logger "trx;LogFileName=haven-release.trx"

      - name: Build automation worker
        run: dotnet build src/Haven.AutomationWorker/Haven.AutomationWorker.csproj -c Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-continuation-test-results
          path: |
            **/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload source snapshot
        if: always() && inputs.upload_source_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: haven-continuation-source
          path: |
            .
            !**/bin/**
            !**/obj/**
            !.git/**
          include-hidden-files: true
          retention-days: 3
