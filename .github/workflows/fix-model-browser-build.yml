name: Fix Model Browser and Build APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-model-browser-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: mobile-haven-outstanding-fixes

      - name: Fix model browser compiler errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Haven.Android/ModelBrowserActivity.cs")
          text = path.read_text()

          replacements = [
              (
                  '''        root.AddView(_search, new LinearLayout.LayoutParams(
              ViewGroup.LayoutParams.MatchParent,
              Dp(52));''',
                  '''        root.AddView(_search, new LinearLayout.LayoutParams(
              ViewGroup.LayoutParams.MatchParent,
              Dp(52)));''',
                  "search layout closing parenthesis",
              ),
              (
                  "public void OnCancel(IDalogInterface? dialog) => action();",
                  "public void OnCancel(IDialogInterface? dialog) => action();",
                  "dialog interface spelling",
              ),
              (
                  '''[property: JsonPropertyName("tags")] string[]? TagsK
          [property: JsonPropertyName("siblings")]''',
                  '''[property: JsonPropertyName("tags")] string[]? Tags,
          [property: JsonPropertyName("siblings")]''',
                  "record parameter separator",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          print("Applied three targeted compiler corrections.")
          PY

      - name: Commit compiler corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/ModelBrowserActivity.cs
          git commit -m "Fix model browser compiler errors"
          git push origin HEAD:mobile-haven-outstanding-fixes

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
