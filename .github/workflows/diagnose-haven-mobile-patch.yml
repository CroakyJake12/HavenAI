name: Repair Android Model Import URI
on:
  push:
    branches: [gpt/haven-mobile-repair-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Disambiguate Android URI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/Haven.Android/ModelImportActivity.cs")
          text = path.read_text(encoding="utf-8")
          alias = "using Uri = Android.Net.Uri;"
          if alias not in text:
              anchor = "using Android.Widget;\nusing System.Text.Json;"
              if text.count(anchor) != 1:
                  raise RuntimeError(f"expected one using anchor, found {text.count(anchor)}")
              text = text.replace(anchor, "using Android.Widget;\nusing Uri = Android.Net.Uri;\nusing System.Text.Json;", 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          rm -f artifacts/android/build-result.txt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/ModelImportActivity.cs
          git add -u artifacts/android/build-result.txt
          git commit -m "Disambiguate Android model import URIs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
