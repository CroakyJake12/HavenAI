name: Repair Haven Mobile Compatibility Sources

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Repair stale Go-handler patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_haven_mobile_repair.py")
          text = path.read_text(encoding="utf-8")
          old = '''    text = replace_once(
                  text,
                  old_go_selection,
                  new_go_selection,
                  "MainView Go installed-app selection",
              )
          '''
          new = '''    if new_go_selection not in text:
                  signature = "    private async void OnGoCatalogItemSelected"
                  boundary = "\n    private void QueueGoSuggestionRefresh"
                  start = text.find(signature)
                  end = text.find(boundary, start)
                  if start < 0 or end < 0:
                      raise RuntimeError(
                          "MainView Go installed-app selection: bounded method anchors not found"
                      )
                  text = text[:start] + new_go_selection + text[end:]
          '''
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          elif new in text:
              print("Go-handler patcher repair already applied.")
          else:
              raise RuntimeError(f"Expected one stale Go patch block, found {count}")
          PY

      - name: Apply compatibility repairs
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          python3 scripts/apply_haven_mobile_repair.py \
            > artifacts/android/mobile-patch-diagnostic.txt 2>&1
          result=$?
          cat artifacts/android/mobile-patch-diagnostic.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist compatibility failure
        if: steps.apply.outputs.result != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/mobile-patch-diagnostic.txt
          git commit -m "Record Haven mobile patch failure [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Commit repaired compatibility sources
        if: steps.apply.outputs.result == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/android/mobile-patch-diagnostic.txt
          if git diff --quiet; then
            echo "Compatibility sources already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_haven_mobile_repair.py
          git add src/Haven.Browser/Security/BrowserPrivateProfileManager.cs
          git add src/Haven.Desktop/Views/Shell/MainView.axaml.cs
          git add src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml
          git add src/Haven.Desktop/Views/Pages/Chat/ChatPage.CodeBehindLayout.cs
          git add -u artifacts/android/mobile-patch-diagnostic.txt
          git commit -m "Apply Haven Android compatibility repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
