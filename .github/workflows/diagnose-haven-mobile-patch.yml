name: Apply Haven Android API compatibility repairs

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Apply deterministic Android API repairs
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_haven_android_api_compat.py
          python3 /tmp/apply_haven_android_api_compat.py > artifacts/android/api-compat-diagnostic.txt 2>&1
          result=$?
          cat artifacts/android/api-compat-diagnostic.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist repair failure
        if: steps.repair.outputs.result != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/api-compat-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Haven Android API repair failure [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 1

      - name: Commit repaired Android sources
        if: steps.repair.outputs.result == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f artifacts/android/api-compat-diagnostic.txt artifacts/android/build-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/ModelImportActivity.cs
          git add src/Haven.Android/HavenLauncherActivity.Apps.cs
          git add src/Haven.Android/HavenLauncherActivity.cs
          git add src/Haven.Android/HavenLauncherActivity.Settings.cs
          git add src/Haven.Android/MainView.Mobile.Layout.cs
          git add -u artifacts/android/api-compat-diagnostic.txt artifacts/android/build-result.txt
          if git diff --cached --quiet; then
            echo "Android API repairs are already applied."
            exit 0
          fi
          git commit -m "Repair Haven Android API compatibity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
