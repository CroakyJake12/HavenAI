name: Diagnose Haven Mobile Patch

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run compatibility patch with persistent diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          python3 scripts/apply_haven_mobile_repair.py > artifacts/android/mobile-patch-diagnostic.txt 2>&1
          result=$?
          cat artifacts/android/mobile-patch-diagnostic.txt
          if [ "$result" -eq 0 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/android/mobile-patch-diagnostic.txt
          git commit -m "Record Haven mobile patch failure [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit "$result"
