name: Apply backend beta pass
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/apply_continuation_backend_pass.py
      - .github/workflows/apply-backend-beta-pass.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply validated backend beta pass') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply backend source patch
        run: python scripts/apply_continuation_backend_pass.py
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore Haven.sln
          dotnet build Haven.sln -c Release --no-restore
      - name: Commit buildable backend
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply validated backend beta pass"
            git push origin HEAD:haven-continuation
          }
      - name: Focused backend tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/Haven.Core.Tests/Haven.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Haven.Infrastructure.Tests/Haven.Infrastructure.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ProviderRoutingRegistrationTests"
          dotnet test tests/Haven.Desktop.Tests/Haven.Desktop.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~CallSingletonIntegrationTests|FullyQualifiedName~CallVoicePreviewControllerTests|FullyQualifiedName~NotesDictationControllerTests|FullyQualifiedName~NotesReadAloudControllerTests|FullyQualifiedName~ExperienceAutomationAndCallTests"
