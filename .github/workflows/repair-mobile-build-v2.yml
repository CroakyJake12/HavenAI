name: Repair Mobile Haven Build V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-mobile-build-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Apply resilient compiler corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              path.write_text(text.replace(old, new, 1))

          model = Path("src/Haven.Android/ModelBrowserActivity.cs")
          replace_once(model, "            SingleLine = true\n", "", "remove unsupported SingleLine property")
          replace_once(model, "        _search.SetTextColor(Color.White);", "        _search.SetSingleLine(true);\n        _search.SetTextColor(Color.White);", "add Android single-line call")
          replace_once(model, "IDalogInterface?", "IDialogInterface?", "dialog interface spelling")
          replace_once(model, "string[]? TagsK\n", "string[]? Tags,\n", "record tags parameter")

          desktop = Path("src/Haven.Desktop/Views/StudioProjectView.axaml.cs")
          replace_once(desktop, "Panel.SetZIndex(_settingsOverlay, 100);", "_settingsOverlay.SetValue(Panel.ZIndexProperty, 100);", "Avalonia Z-index attached property")
          print("Applied 5 bounded source corrections.")
          PY

      - name: Commit targeted corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Android/ModelBrowserActivity.cs src/Haven.Desktop/Views/StudioProjectView.axaml.cs
          git commit -m "Repair remaining Mobile Haven compiler errors"
          git push origin HEAD:mobile-haven-outstanding-fixes

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
