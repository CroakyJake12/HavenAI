name: Compile Mobile Haven APK Resolved

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compile-mobile-haven-apk-resolved.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Apply remaining compiler corrections
        shell: bash
        run: |
          python3 -<<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  print(f"{label} already applied.")
                  return
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              path.write_text(text.replace(old, new, 1))
              print(f"Applied {label}.")

          replace_once(
              "src/Haven.Android/HavenLauncherActivity.cs",
              "Android.Resource.Drawable.IcMenuView",
              'SystemDrawable("ic_menu_view")',
              "launcher app drawer icon")

          replace_once(
              "src/Haven.Android/ModelBrowserActivity.cs",
              "Android.Resource.Layout.SimpleSpinnerDropDownItem",
              "Android.Resource.Layout.SimpleSpinnerItem",
              "model browser spinner layout")

          browser = Path("src/Haven.Desktop/Interface/BrowserSafetyView.axaml.cs")
          text = browser.read_text()
          if "using Avalonia.Markup.Xaml;" not in text:
              marker = "using Avalonia.Controls;\n"
              if text.count(marker) != 1:
                  raise SystemExit("Browser Safety using marker was not unique.")
              text = text.replace(marker, marker + "using Avalonia.Markup.Xaml;\n", 1)
          if "InitializeComponent();" in text:
              if text.count("InitializeComponent();") != 1:
                  raise SystemExit("Browser Safety initializer was not unique.")
              text = text.replace("InitializeComponent();", "AvaloniaXamlLoader.Load(this);", 1)
          elif "AvaloniaXamlLoader.Load(this);" not in text:
              raise SystemExit("Browser Safety initializer was not found.")
          browser.write_text(text)

          checks = {
              "launcher icon": 'SystemDrawable("ic_menu_view")' in Path("src/Haven.Android/HavenLauncherActivity.cs").read_text(),
              "spinner layout": "Android.Resource.Layout.SimpleSpinnerItem" in Path("src/Haven.Android/ModelBrowserActivity.cs").read_text(),
              "browser xaml loader": "AvaloniaXamlLoader.Load(this);" in browser.read_text(),
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Correction validation failed: " + ", ".join(failed))
          print("Validated remaining compiler corrections.")
          PY

      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Corrections already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/Haven.Android/HavenLauncherActivity.cs \
              src/Haven.Android/ModelBrowserActivity.cs \
              src/Haven.Desktop/Interface/BrowserSafetyView.axaml.cs
            git commit -m "Resolve remaining Mobile Haven APK build errors"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Outstanding-Fixes-APK"
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
          } > .github/build-status/mobile-haven-apk.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-apk.txt
          git commit -m "Record successful Mobile Haven APK build"
          git push origin HEAD:mobile-haven-outstanding-fixes
