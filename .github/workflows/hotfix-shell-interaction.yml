name: Validate shell interaction hotfix

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/hotfix-shell-interaction.yml
      - scripts/hotfix_shell_interaction.py
      - src/Haven.Desktop/Views/Shell/MainView.BetaOverlays.cs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Haven.sln

      - name: Release build
        run: dotnet build Haven.sln -c Release --no-restore

      - name: Remove temporary validator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-shell-interaction.yml scripts/hotfix_shell_interaction.py
          git commit -m "Remove shell hotfix validator after successful build"
          git fetch origin haven-continuation
          git rebase origin/haven-continuation
          git push origin HEAD:haven-continuation
