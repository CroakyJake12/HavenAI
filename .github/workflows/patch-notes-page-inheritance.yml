name: Patch NotesPage inheritance

on:
  push:
    branches: [haven-continuation]
    paths: [.github/workflows/patch-notes-page-inheritance.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'Make NotesPage inheritable') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - shell: pwsh
        run: |
          $p='src/Haven.Desktop/Views/Pages/Notes/NotesPage.axaml.cs'
          $t=Get-Content $p -Raw
          $t=$t.Replace('public sealed partial class NotesPage : UserControl, IDisposable, INotifyPropertyChanged','public partial class NotesPage : UserControl, IDisposable, INotifyPropertyChanged')
          Set-Content $p $t -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $p
          if (-not (git diff --cached --quiet)) {
            git commit -m "Make NotesPage inheritable"
            git push origin HEAD:haven-continuation
          }
