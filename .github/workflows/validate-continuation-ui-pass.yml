name: Validate visible beta UI
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/apply_continuation_ui_pass.py
      - scripts/validate_continuation_ui_pass.py
      - src/Haven.Desktop/Views/Shell/MainView.BetaOverlays.cs
      - src/Haven.Desktop/Views/Shell/Overlays/**
      - .github/workflows/validate-continuation-ui-pass.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'visible beta UI validation') && !contains(github.event.head_commit.message || '', 'validated visible beta UI') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/validate_continuation_ui_pass.py
