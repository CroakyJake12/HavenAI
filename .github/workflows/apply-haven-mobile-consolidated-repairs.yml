# retry with verified payload parts
name: Apply Haven Mobile Consolidated Repairs
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]
    paths: ['.github/workflows/apply-haven-mobile-consolidated-repairs.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply verified repair
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          cat scripts/apply_haven_mobile_consolidated_repairs.part0 scripts/apply_haven_mobile_consolidated_repairs.part1a scripts/apply_haven_mobile_consolidated_repairs.part1b scripts/apply_haven_mobile_consolidated_repairs.part2 scripts/apply_haven_mobile_consolidated_repairs.part3 > /tmp/repair.py.gz
          echo "b743b61404042222b60efb1a083eea4ebf9d9c469be890257adbef85fc8b0a3c3  /tmp/repair.py.gz" | sha256sum -c -
          integrity=$?
          if [ "$integrity" -eq 0 ]; then
            gzip -dc /tmp/repair.py.gz > /tmp/repair.py
            echo "ec97aec010c20e3cd0d0c6016fa0f631290ff7379e5ea6add01c91cf8b313e49  /tmp/repair.py" | sha256sum -c -
            integrity=$?
          fi
          code=99
          if [ "$integrity" -eq 0 ]; then
            python -m py_compile /tmp/repair.py
            python /tmp/repair.py > artifacts/android/repair.log 2>&1
            code=$?
          fi
          {
            echo "input_commit=${{ github.sha }}"
            echo "integrity_exit=$integrity"
            echo "repair_exit=$code"
            echo "payload_hashes:"
            sha256sum scripts/apply_haven_mobile_consolidated_repairs.part0 scripts/apply_haven_mobile_consolidated_repairs.part1a scripts/apply_haven_mobile_consolidated_repairs.part1b scripts/apply_haven_mobile_consolidated_repairs.part2 scripts/apply_haven_mobile_consolidated_repairs.part3 /tmp/repair.py.gz
            test -f artifacts/android/repair.log && tail -n 500 artifacts/android/repair.log
          } > artifacts/android/repair-result.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.repair.outputs.code }}" = "0" ]; then
            git add src/Haven.Android/Haven.Android.csproj src/Haven.Android/HavenLauncherActivity.Apps.cs src/Haven.Android/HavenLauncherActivity.cs src/Haven.Android/MainView.Mobile.Drawers.cs src/Haven.Android/MainView.Mobile.Interactions.cs src/Haven.Android/MainView.Mobile.Layout.cs src/Haven.Android/ModelImportActivity.cs src/Haven.Desktop/Views/GenerativeUiThemeSelectorView.axaml src/Haven.Desktop/Views/Pages/Go/GoPage.axaml src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml.cs src/Haven.Desktop/Views/Shell/MainView.axaml.cs
            message="Apply consolidated Haven Mobile repairs [skip ci]"
          else
            git add -f artifacts/android/repair-result.txt
            message="Record consolidated mobile repair failure [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push
          fi
          test "${{ steps.repair.outputs.code }}" = "0"
