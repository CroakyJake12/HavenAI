name: Run Current Haven Mobile Repair
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]
    paths: ['.github/workflows/apply-haven-mobile-consolidated-repairs.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run verified repair
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/run_mobile_repair.part0 scripts/run_mobile_repair.part1 > /tmp/run-mobile-repair.sh
          echo "e6758fc2665049e617dc9a6bf6d0d5d6b7726b8e8142431d0796bd01a4d44d1b  /tmp/run-mobile-repair.sh" | sha256sum -c -
          echo "cc6ca1d7e6d9038241272eb7d5c5f784bbb4bacaee6a115c7d74058c3719700b  scripts/mobile_repair_compat.py" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/run-mobile-repair.sh")
          text = path.read_text()
          needle = "python -m py_compile /tmp/repair.py\n"
          replacement = "python scripts/mobile_repair_compat.py\n" + needle
          if needle not in text:
              raise SystemExit("runner compile anchor not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          bash -n /tmp/run-mobile-repair.sh
          bash /tmp/run-mobile-repair.sh
