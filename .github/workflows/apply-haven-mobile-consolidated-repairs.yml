name: Apply Haven Mobile Consolidated Repairs
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]
    paths:
      - '.github/workflows/apply-haven-mobile-consolidated-repairs.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and apply repairs
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          cat             scripts/apply_haven_mobile_consolidated_repairs.part0             scripts/apply_haven_mobile_consolidated_repairs.part1a             scripts/apply_haven_mobile_consolidated_repairs.part1b             scripts/apply_haven_mobile_consolidated_repairs.part2             scripts/apply_haven_mobile_consolidated_repairs.part3             > /tmp/haven-mobile-repair.py.gz
          echo "154df8abbf87f0530aef3cb615b23c1bafe490a2e3d2f7acf9b53a299a79cd7d  /tmp/haven-mobile-repair.py.gz" | sha256sum -c -
          integrity_exit=$?
          if [ "$integrity_exit" -eq 0 ]; then
            gzip -dc /tmp/haven-mobile-repair.py.gz > /tmp/haven-mobile-repair.py
            echo "1b9f6f42775dc4bcd8460fdc4ecb7e12d6b3488780673ae36616354215d44245  /tmp/haven-mobile-repair.py" | sha256sum -c -
            integrity_exit=$?
          fi
          repair_exit=99
          if [ "$integrity_exit" -eq 0 ]; then
            python -m py_compile /tmp/haven-mobile-repair.py
            python /tmp/haven-mobile-repair.py 2>&1 | tee artifacts/android/repair.log
            repair_exit=${PIPESTATUS[0]}
          fi
          {
            echo "input_commit=${{ github.sha }}"
            echo "integrity_exit=$integrity_exit"
            echo "repair_exit=$repair_exit"
            test -f artifacts/android/repair.log && tail -n 500 artifacts/android/repair.log
          } > artifacts/android/repair-result.txt
          echo "repair_exit=$repair_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit scoped repairs or diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.repair.outputs.repair_exit }}" = "0" ]; then
            git add               src/Haven.Android/Haven.Android.csproj               src/Haven.Android/HavenLauncherActivity.Apps.cs               src/Haven.Android/HavenLauncherActivity.cs               src/Haven.Android/MainView.Mobile.Drawers.cs               src/Haven.Android/MainView.Mobile.Interactions.cs               src/Haven.Android/MainView.Mobile.Layout.cs               src/Haven.Android/ModelImportActivity.cs               src/Haven.Desktop/Views/GenerativeUiThemeSelectorView.axaml               src/Haven.Desktop/Views/Pages/Go/GoPage.axaml               src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml               src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml.cs               src/Haven.Desktop/Views/Shell/MainView.axaml.cs
            message="Apply consolidated Haven Mobile repairs [skip ci]"
          else
            git add -f artifacts/android/repair-result.txt
            message="Record consolidated mobile repair failure [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push
          fi
          test "${{ steps.repair.outputs.repair_exit }}" = "0"
