name: Validate focused Chat backend
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/validate_focused_chat_backend.py
      - .github/workflows/validate-focused-chat-backend.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Record focused Chat backend validation') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/validate_focused_chat_backend.py
