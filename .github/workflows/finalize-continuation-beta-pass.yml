name: Finalize continuation beta pass
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/finalize_continuation_beta_pass.py
      - .github/workflows/finalize-continuation-beta-pass.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'Finalize validated beta backend and visible UI') && !contains(github.event.head_commit.message || '', 'Record final beta-pass validation') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/finalize_continuation_beta_pass.py
