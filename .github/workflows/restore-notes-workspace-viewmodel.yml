name: Restore Notes workspace view model

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/restore-notes-workspace-viewmodel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message || '', 'Restore validated Notes workspace view model') }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Find and restore latest historical implementation
        id: history
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/notes-restore | Out-Null
          $match = $null

          foreach ($commit in (git rev-list --all --date-order)) {
            $matches = @(git grep -l 'class NotesWorkspaceViewModel' $commit -- '*.cs' 2>$null)
            if ($LASTEXITCODE -eq 0 -and $matches.Count -gt 0) {
              $first = $matches[0].ToString()
              $separator = $first.IndexOf(':')
              if ($separator -gt 0) {
                $match = [PSCustomObject]@{
                  Commit = $commit
                  Path = $first.Substring($separator + 1)
                }
                break
              }
            }
          }

          if (-not $match) {
            'No historical NotesWorkspaceViewModel implementation was found.' |
              Set-Content artifacts/notes-restore/SEARCH.txt
            exit 1
          }

          $target = 'src/Haven.Desktop/ViewModels/NotesWorkspaceViewModel.cs'
          $source = git show "$($match.Commit):$($match.Path)"
          New-Item -ItemType Directory -Force (Split-Path $target -Parent) | Out-Null
          $source | Set-Content $target -Encoding utf8
          "Commit=$($match.Commit)`nPath=$($match.Path)" |
            Set-Content artifacts/notes-restore/SOURCE.txt

      - name: Restore
        id: dotnet-restore
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Haven.sln 2>&1 |
            Tee-Object artifacts/notes-restore/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Haven.sln -c Release --no-restore 2>&1 |
            Tee-Object artifacts/notes-restore/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test Haven.sln -c Release --no-build 2>&1 |
            Tee-Object artifacts/notes-restore/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write validation summary
        if: always()
        shell: pwsh
        run: |
          @(
            '# Notes workspace restore validation',
            '',
            '| Stage | Result |',
            '|---|---|',
            '| History search | ${{ steps.history.outcome }} |',
            '| Restore | ${{ steps.dotnet-restore.outcome }} |',
            '| Build | ${{ steps.build.outcome }} |',
            '| Test | ${{ steps.test.outcome }} |'
          ) | Set-Content artifacts/notes-restore/VALIDATION.md

      - name: Commit validated source or diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artifacts/notes-restore
          if ('${{ steps.build.outcome }}' -eq 'success' -and '${{ steps.test.outcome }}' -eq 'success') {
            git add src/Haven.Desktop/ViewModels/NotesWorkspaceViewModel.cs
          }

          if (-not (git diff --cached --quiet)) {
            git commit -m "Restore validated Notes workspace view model"
            git push origin HEAD:haven-continuation
          }

      - name: Fail when validation failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.history.outcome }}' -ne 'success' -or
              '${{ steps.dotnet-restore.outcome }}' -ne 'success' -or
              '${{ steps.build.outcome }}' -ne 'success' -or
              '${{ steps.test.outcome }}' -ne 'success') {
            exit 1
          }
