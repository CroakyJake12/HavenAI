name: Repair Remaining Android Errors and Build APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-remaining-android-errors-build-apk.yml
      - scripts/repair_mobile_remaining_compile_errors.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout workflow support files
        uses: actions/checkout@v4
        with:
          ref: main
          path: workflow
          fetch-depth: 1

      - name: Checkout outstanding fixes
        uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          path: source
          fetch-depth: 0

      - name: Apply remaining compile repairs
        working-directory: source
        run: python3 ../workflow/scripts/repair_mobile_remaining_compile_errors.py

      - name: Commit repairs
        working-directory: source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repairs already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add               src/Haven.Android/ModelBrowserActivity.cs               src/Haven.Android/HavenLauncherActivity.cs               src/Haven.Android/MainView.Mobile.Layout.cs
            git commit -m "Resolve remaining Android compile errors"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        working-directory: source
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        id: build
        working-directory: source
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record build failure
        if: steps.build.outputs.exit_code != '0'
        working-directory: source
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "build_exit=${{ steps.build.outputs.exit_code }}"
            echo
            cat build.log
          } > .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-build.log
          git commit -m "Record Mobile Haven APK build failure"
          git push origin HEAD:mobile-haven-outstanding-fixes
          exit 1

      - name: Publish APK
        id: publish
        working-directory: source
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj             -c Debug             -f net10.0-android             --no-restore             -p:AndroidPackageFormat=apk             -p:AndroidKeyStore=false 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record publish failure
        if: steps.publish.outputs.exit_code != '0'
        working-directory: source
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "publish_exit=${{ steps.publish.outputs.exit_code }}"
            echo
            cat publish.log
          } > .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-build.log
          git commit -m "Record Mobile Haven APK publish failure"
          git push origin HEAD:mobile-haven-outstanding-fixes
          exit 1

      - name: Collect APK
        working-directory: source
        shell: bash
        run: |
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: source/artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        working-directory: source
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Outstanding-Fixes-APK"
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
          } > .github/build-status/mobile-haven-apk.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-apk.txt
          git commit -m "Record successful Mobile Haven APK build"
          git push origin HEAD:mobile-haven-outstanding-fixes
