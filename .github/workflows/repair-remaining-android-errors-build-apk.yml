name: Repair Remaining Android Errors and Build APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-remaining-android-errors-build-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/apk-build-trigger/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout Mobile Haven repair branch
        uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          path: source
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        working-directory: source
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Publish Android APK
        id: publish
        working-directory: source
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record publish failure
        if: steps.publish.outputs.exit_code != '0'
        working-directory: source
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "publish_exit=${{ steps.publish.outputs.exit_code }}"
            echo
            cat publish.log
          } > .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-build.log
          git commit -m "Record Mobile Haven APK publish failure"
          git push origin HEAD:mobile-haven-outstanding-fixes
          exit 1

      - name: Collect and verify installable APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          output_dir="artifacts/android"
          mkdir -p "$output_dir"

          mapfile -t all_apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -print)
          if [ "${#all_apks[@]}" -eq 0 ]; then
            echo "Publish exited successfully but produced no APK." >&2
            exit 1
          fi

          selected=()
          for apk in "${all_apks[@]}"; do
            if [[ "$apk" == *-Signed.apk ]]; then
              selected+=("$apk")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            selected=("${all_apks[@]}")
          fi

          for apk in "${selected[@]}"; do
            cp "$apk" "$output_dir/"
          done

          apksigner="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"

          : > "$output_dir/APK-INFO.txt"
          for apk in "$output_dir"/*.apk; do
            test -s "$apk"
            unzip -t "$apk"
            unzip -Z1 "$apk" | grep -qx 'AndroidManifest.xml'
            "$apksigner" verify --verbose "$apk"
            {
              echo "file=$(basename "$apk")"
              "$aapt" dump badging "$apk" | sed -n '1,3p'
              echo
            } >> "$output_dir/APK-INFO.txt"
          done

          sha256sum "$output_dir"/*.apk > "$output_dir/SHA256SUMS.txt"
          stat --printf='%n %s bytes\n' "$output_dir"/*.apk > "$output_dir/SIZES.txt"
          ls -lh "$output_dir"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Verified-APK
          path: source/artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        working-directory: source
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Verified-APK"
            echo "integrity=zip-ok"
            echo "signature=verified"
            echo "manifest=present"
            echo "apk_info:"
            cat artifacts/android/APK-INFO.txt
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
            echo "sizes:"
            cat artifacts/android/SIZES.txt
          } > .github/build-status/mobile-haven-apk.txt
          rm -f .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/build-status
          git commit -m "Record successful Mobile Haven APK build"
          git push origin HEAD:mobile-haven-outstanding-fixes
