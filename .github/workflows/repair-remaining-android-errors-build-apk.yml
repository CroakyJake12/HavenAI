name: Build Export APK

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target:
    branches: [main]
    paths:
      - ".github/apk-trigger/**"

permissions:
  contents: write

concurrency:
  group: apk-export
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: apk-output-20260806-2204
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/haven-mobile-repair-android
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and export
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/out
          exec > >(tee /tmp/out/build.log) 2>&1
          s=0

          python3 scripts/apply_haven_mobile_repair.py || s=20
          if [ "$s" = 0 ]; then
            python3 scripts/repair_android_compile_blockers.py || s=21
          fi
          if [ "$s" = 0 ]; then
            dotnet workload install android || s=30
          fi
          if [ "$s" = 0 ]; then
            dotnet restore src/Haven.Android/Haven.Android.csproj || s=40
          fi
          if [ "$s" = 0 ]; then
            dotnet publish src/Haven.Android/Haven.Android.csproj               -c Debug               -f net10.0-android               --no-restore               -p:AndroidPackageFormat=apk               -p:AndroidKeyStore=false || s=50
          fi

          if [ "$s" = 0 ]; then
            apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*-Signed.apk' | head -n 1)"
            [ -n "$apk" ] || apk="$(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | head -n 1)"
            [ -n "$apk" ] || s=60
          fi

          if [ "$s" = 0 ]; then
            cp "$apk" /tmp/out/Haven-Mobile.apk
            unzip -t /tmp/out/Haven-Mobile.apk || s=70
            unzip -Z1 /tmp/out/Haven-Mobile.apk | grep -qx AndroidManifest.xml || s=71
          fi

          if [ "$s" = 0 ]; then
            signer="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            [ -x "$signer" ] && "$signer" verify --verbose /tmp/out/Haven-Mobile.apk || s=72
          fi

          if [ "$s" = 0 ]; then
            sha256sum /tmp/out/Haven-Mobile.apk > /tmp/out/SHA256SUMS.txt
            stat --printf='%s\n' /tmp/out/Haven-Mobile.apk > /tmp/out/SIZE.txt
            base64 -w0 /tmp/out/Haven-Mobile.apk | split -b 700000 -d -a 4 - /tmp/out/apk.b64.part-
            echo SUCCESS > /tmp/out/STATUS.txt
          else
            echo FAILED > /tmp/out/STATUS.txt
          fi

          printf 'status=%s\nsource=%s\nrun=%s\n' "$s" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > /tmp/out/RESULT.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$OUT:$OUT"
          git checkout "$OUT"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          mkdir result
          cp -a /tmp/out/. result/
          git add result
          git commit -m "Export APK run $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$OUT"
          exit "$s"
