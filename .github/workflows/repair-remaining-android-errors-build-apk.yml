name: Build Verified Mobile Haven APK

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: verified-mobile-haven-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repaired Mobile Haven branch
        uses: actions/checkout@v4
        with:
          ref: gpt/haven-mobile-repair-android
          fetch-depth: 1

      - name: Apply deterministic mobile compatibility repairs
        run: |
          python3 scripts/apply_haven_mobile_repair.py
          python3 scripts/repair_android_compile_blockers.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Publish Android APK
        run: |
          set -o pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee publish.log

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          output_dir="artifacts/android"
          mkdir -p "$output_dir"

          mapfile -t all_apks < <(
            find src/Haven.Android/bin/Debug/net10.0-android \
              -type f -name '*.apk' -print | sort
          )
          if [ "${#all_apks[@]}" -eq 0 ]; then
            echo "dotnet publish produced no APK." >&2
            exit 1
          fi

          selected=()
          for apk in "${all_apks[@]}"; do
            if [[ "$apk" == *-Signed.apk ]]; then
              selected+=("$apk")
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            selected=("${all_apks[@]}")
          fi

          for apk in "${selected[@]}"; do
            cp "$apk" "$output_dir/"
          done

          apksigner="$(
            find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" \
              -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1
          )"
          test -x "$apksigner"

          for apk in "$output_dir"/*.apk; do
            test -s "$apk"
            unzip -t "$apk"
            unzip -Z1 "$apk" | grep -qx 'AndroidManifest.xml'
            "$apksigner" verify --verbose "$apk"
          done

          sha256sum "$output_dir"/*.apk > "$output_dir/SHA256SUMS.txt"
          stat --printf='%n %s bytes\n' "$output_dir"/*.apk > "$output_dir/SIZES.txt"
          cp publish.log "$output_dir/publish.log"
          ls -lh "$output_dir"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Verified-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
