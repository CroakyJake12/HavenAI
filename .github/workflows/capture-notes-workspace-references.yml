name: Fix status and capture Notes references

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/capture-notes-workspace-references.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', 'Fix Chat status subscription and capture Notes references') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Patch status control and capture references
        shell: pwsh
        run: |
          $path = 'src/Haven.Desktop/Controls/ChatExecutionStatusControl.cs'
          $text = Get-Content $path -Raw
          $old = '        this.GetObservable(SnapshotProperty).Subscribe(ApplySnapshot);'
          if ($text.Contains($old)) {
            $text = $text.Replace($old, '')
            $insertBefore = '    private void ApplySnapshot(ChatExecutionSnapshot? snapshot)'
            $override = @"
              protected override void OnPropertyChanged(AvaloniaPropertyChangedEventArgs change)
              {
                  base.OnPropertyChanged(change);
                  if (change.Property == SnapshotProperty)
                  {
                      ApplySnapshot(Snapshot);
                  }
              }

          "@
            $text = $text.Replace($insertBefore, $override + $insertBefore)
            Set-Content $path $text -Encoding utf8
          }

          New-Item -ItemType Directory -Force artifacts/compiler-repair | Out-Null
          Get-ChildItem src -Recurse -File -Include *.cs,*.axaml |
            Select-String -Pattern 'NotesWorkspaceViewModel' -Context 8,8 |
            Out-String -Width 500 |
            Set-Content artifacts/compiler-repair/notes-workspace-references.txt -Encoding utf8

      - name: Build for fresh diagnostics
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Haven.sln
          dotnet build Haven.sln -c Release --no-restore 2>&1 |
            Tee-Object artifacts/compiler-repair/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit repair and diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Desktop/Controls/ChatExecutionStatusControl.cs artifacts/compiler-repair
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix Chat status subscription and capture Notes references"
            git push origin HEAD:haven-continuation
          }
