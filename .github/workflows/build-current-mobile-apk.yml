name: Build Current Mobile Haven APK

on:
  push:
    branches:
      - mobile-haven-outstanding-fixes
    paths:
      - ".github/workflows/build-current-mobile-apk.yml"
      - "global.json"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Publish Android APK
        id: publish
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record publish failure
        if: steps.publish.outputs.exit_code != '0'
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "publish_exit=${{ steps.publish.outputs.exit_code }}"
            echo
            cat publish.log
          } > .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-build.log
          git commit -m "Record Mobile Haven APK publish failure"
          git push origin HEAD:mobile-haven-outstanding-fixes
          exit 1

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Publish exited successfully but produced no APK." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" artifacts/android/
          done
          for apk in artifacts/android/*.apk; do
            test -s "$apk"
            unzip -t "$apk"
            unzip -Z1 "$apk" | grep -qx 'AndroidManifest.xml'
          done
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          stat --printf='%n %s bytes\n' artifacts/android/*.apk > artifacts/android/SIZES.txt
          ls -lh artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Current-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Current-APK"
            echo "integrity=zip-ok"
            echo "manifest=present"
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
            echo "sizes:"
            cat artifacts/android/SIZES.txt
          } > .github/build-status/mobile-haven-apk.txt
          rm -f .github/build-status/mobile-haven-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/build-status
          if git diff --cached --quiet; then
            echo "APK success status is unchanged."
          else
            git commit -m "Record successful Mobile Haven APK build"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi
