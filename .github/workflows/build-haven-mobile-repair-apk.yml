name: Build Haven Mobile Repair APK
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet workload install android
      - run: dotnet restore src/Haven.Android/Haven.Android.csproj --configfile NuGet.Config
      - run: dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - run: |
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
