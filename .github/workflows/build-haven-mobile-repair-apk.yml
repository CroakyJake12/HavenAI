name: Build Haven Mobile Repair APK
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]
permissions:
  contents: write
concurrency:
  group: haven-mobile-repair-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Modernize launcher Android APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/Haven.Android/HavenLauncherActivity.cs")
          text = path.read_text(encoding="utf-8")
          original = text

          old_bars = "        Window?.SetStatusBarColor(Color.Transparent);\n        Window?.SetNavigationBarColor(Color.Rgb(24, 18, 38));"
          new_bars = "        if (!OperatingSystem.IsAndroidVersionAtLeast(35))\n        {\n            Window?.SetStatusBarColor(Color.Transparent);\n            Window?.SetNavigationBarColor(Color.Rgb(24, 18, 38));\n        }"
          if old_bars in text:
              text = text.replace(old_bars, new_bars, 1)
          elif new_bars not in text:
              raise SystemExit("System-bar API anchor was not found.")

          old_back = "        base.OnBackPressed();"
          new_back = "        // The launcher owns the root back destination.\n        return;"
          if old_back in text:
              text = text.replace(old_back, new_back, 1)
          elif new_back not in text:
              raise SystemExit("Back-navigation API anchor was not found.")

          if text != original:
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Haven.Android/HavenLauncherActivity.cs
          if ! git diff --cached --quiet; then
            git commit -m "Use version-safe Android launcher APIs [skip ci]"
            git push
          fi
      - run: dotnet workload install android
      - name: Restore and publish
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          dotnet restore src/Haven.Android/Haven.Android.csproj --configfile NuGet.Config 2>&1 | tee artifacts/android/restore.log
          restore_exit=${PIPESTATUS[0]}
          publish_exit=99
          if [ "$restore_exit" -eq 0 ]; then
            dotnet publish src/Haven.Android/Haven.Android.csproj -c Debug -f net10.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false 2>&1 | tee artifacts/android/publish.log
            publish_exit=${PIPESTATUS[0]}
          else
            : > artifacts/android/publish.log
          fi
          {
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "input_commit=${{ github.sha }}"
            echo "built_tree=$(git rev-parse HEAD)"
            echo "restore_exit=$restore_exit"
            echo "publish_exit=$publish_exit"
            echo "restore_log_tail:"
            tail -n 120 artifacts/android/restore.log
            echo "publish_log_tail:"
            tail -n 500 artifacts/android/publish.log
          } > artifacts/android/build-result.txt
          package_exit=1
          if [ "$restore_exit" -eq 0 ] && [ "$publish_exit" -eq 0 ]; then
            find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
            if find artifacts/android -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
              sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt
              package_exit=0
            else
              echo "No APK found after successful publish." >> artifacts/android/build-result.txt
            fi
          fi
          echo "package_exit=$package_exit" >> artifacts/android/build-result.txt
          echo "$package_exit" > artifacts/android/exit-code.txt
          exit 0
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f artifacts/android/build-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Android APK build result [skip ci]"
            git push
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-Build-Evidence
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
      - name: Upload APK
        if: ${{ hashFiles('artifacts/android/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce APK gate
        run: test "$(cat artifacts/android/exit-code.txt)" -eq 0
