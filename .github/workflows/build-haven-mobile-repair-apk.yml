name: Build Haven Mobile Consolidated Repair APK
on:
  workflow_dispatch:
  push:
    branches: [gpt/haven-mobile-repair-android]

permissions:
  contents: write

concurrency:
  group: haven-mobile-repair-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAVEN_KEYSTORE_B64: ${{ secrets.HAVEN_ANDROID_KEYSTORE_B64 }}
      HAVEN_KEY_ALIAS: ${{ secrets.HAVEN_ANDROID_KEY_ALIAS }}
      HAVEN_KEYSTORE_PASSWORD: ${{ secrets.HAVEN_ANDROID_KEYSTORE_PASSWORD }}
      HAVEN_KEY_PASSWORD: ${{ secrets.HAVEN_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and apply consolidated repair
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          {
            echo "part0  0909353f92b9e0eb50a7a9d852a3d1b4e044d9cccc382cb2b3b2c2abec9592ba"
            echo "part1  7193d0c09dd4cee28a35677166d040c75fbcaf6961941ecc460b59e1cc5b9a08"
            echo "part2  5355a6cd4b448e904a396610c1cf971fff27ef64b16ae96f3276dd98ec28eae7"
            echo "part3  300a3363b155d7f76a04881e992cc5212ab6d090b9cfade7346cb8d0e78e2191"
          } > artifacts/android/repair-parts.txt
          sha256sum scripts/apply_haven_mobile_consolidated_repairs.part* | tee artifacts/android/repair-part-hashes.txt
          cat scripts/apply_haven_mobile_consolidated_repairs.part0 \
              scripts/apply_haven_mobile_consolidated_repairs.part1 \
              scripts/apply_haven_mobile_consolidated_repairs.part2 \
              scripts/apply_haven_mobile_consolidated_repairs.part3 > /tmp/haven-mobile-repair.py.gz
          echo "f2948406c74ef761be69dee4d28a4f26f2344126ca27ff53b0c874767bbb38cf  /tmp/haven-mobile-repair.py.gz" | sha256sum -c - | tee artifacts/android/repair-gzip-check.txt
          gzip -t /tmp/haven-mobile-repair.py.gz
          gzip -dc /tmp/haven-mobile-repair.py.gz > /tmp/haven-mobile-repair.py
          echo "8ec8c4f0bfc8188dd329a6d83bd456badb4797e5498dc4ab57326f319500d478  /tmp/haven-mobile-repair.py" | sha256sum -c - | tee artifacts/android/repair-script-check.txt
          python -m py_compile /tmp/haven-mobile-repair.py
          python /tmp/haven-mobile-repair.py 2>&1 | tee artifacts/android/repair.log
          repair_exit=${PIPESTATUS[0]}
          echo "repair_exit=$repair_exit" >> "$GITHUB_OUTPUT"
          echo "$repair_exit" > artifacts/android/repair-exit.txt
          exit 0

      - name: Commit repaired source
        if: steps.repair.outputs.repair_exit == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Haven.Android/Haven.Android.csproj \
            src/Haven.Android/HavenLauncherActivity.Apps.cs \
            src/Haven.Android/HavenLauncherActivity.cs \
            src/Haven.Android/MainView.Mobile.Drawers.cs \
            src/Haven.Android/MainView.Mobile.Interactions.cs \
            src/Haven.Android/MainView.Mobile.Layout.cs \
            src/Haven.Android/ModelImportActivity.cs \
            src/Haven.Desktop/Views/GenerativeUiThemeSelectorView.axaml \
            src/Haven.Desktop/Views/Pages/Go/GoPage.axaml \
            src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml \
            src/Haven.Desktop/Views/Pages/Settings/SettingsPage.axaml.cs \
            src/Haven.Desktop/Views/Shell/MainView.axaml.cs
          if ! git diff --cached --quiet; then
            git commit -m "Apply consolidated Haven Mobile repairs [skip ci]"
            git push
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.repair.outputs.repair_exit == '0'
        with:
          global-json-file: global.json

      - name: Install Android workload
        if: steps.repair.outputs.repair_exit == '0'
        run: dotnet workload install android

      - name: Calculate version and signing
        if: steps.repair.outputs.repair_exit == '0'
        shell: bash
        run: |
          app_version=$((200000 + GITHUB_RUN_NUMBER))
          display_version="0.2.${GITHUB_RUN_NUMBER}-mobile-preview"
          signing_mode="ephemeral-debug"
          signing_args="-p:AndroidKeyStore=false"
          if [ -n "$HAVEN_KEYSTORE_B64" ] && [ -n "$HAVEN_KEY_ALIAS" ] && [ -n "$HAVEN_KEYSTORE_PASSWORD" ] && [ -n "$HAVEN_KEY_PASSWORD" ]; then
            printf '%s' "$HAVEN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/haven-mobile.keystore"
            chmod 600 "$RUNNER_TEMP/haven-mobile.keystore"
            signing_mode="persistent-secret-keystore"
            signing_args="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/haven-mobile.keystore -p:AndroidSigningKeyAlias=$HAVEN_KEY_ALIAS -p:AndroidSigningStorePass=env:HAVEN_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:HAVEN_KEY_PASSWORD"
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "DISPLAY_VERSION=$display_version" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$signing_mode" >> "$GITHU_ENV"
          echo "SIGNING_ARGS=$signing_args" >> "$GITHU_ENV"

      - name: Restore and publish APK
        id: build
        if: steps.repair.outputs.repair_exit == '0'
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          dotnet restore src/Haven.Android/Haven.Android.csproj --configfile NuGet.Config 2>&1 | tee artifacts/android/restore.log
          restore_exit=${PIPESTATUS[0]}
          publish_exit=99
          if [ "$restore_exit" -eq 0 ]; then
            # shellcheck disable=SC2086
            dotnet publish src/Haven.Android/Haven.Android.csproj \
              -c Debug -f net10.0-android --no-restor \
              -p:AndroidPackageFormat=apk \
              -p:ApplicationVersion="$APP_VERSION" \
              -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
              $SIGNING_ARGS 2>&1 | tee artifacts/android/publish.log
            publish_exit=${PIPESTATUS[0]}
          else
            : > artifacts/android/publish.log
          fi
          package_exit=1
          if [ "$restore_exit" -eq 0 ] && [ "$publish_exit" -eq 0 ]; then
            find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
            if find artifacts/android -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
              sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt
              package_exit=0
            fi
          fi
          {
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "input_commit=${{ github.sha }}"
            echo "built_tree=$(git rev-parse HEAD)"
            echo "application_version=$APP_VERSION"

            echo "display_version=$DISPLAY_VERSION"
            echo "signing_mode=$SIGNING_MODE"
            echo "restore_exit=$restore_exit"
            echo "publish_exit=$publish_exit"
            echo "package_exit=$package_exit"
            echo "repair_exit=${{ steps.repair.outputs.repair_exit }}"
            echo "restore_log_tail:"
            tail -n 120 artifacts/android/restore.log
            echo "publish_log_tail:"
            tail -n 500 artifacts/android/publish.log
          } > artifacts/android/build-result.txt
          echo "$package_exit" > artifacts/android/exit-code.txt
          exit 0

      - name: Persist build evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ ! -f artifacts/android/exit-code.txt ]; then
            {
              echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "input_commit=${{ github.sha }}"
              echo "built_tree=$(git rev-parse HEAD)"
              echo "repair_exit=${{ steps.repair.outputs.repair_exit }}"
              echo "repair_log:"
              test -f artifacts/android/repair.log && tail -n 500 artifacts/android/repair.log
              echo "repair_part_hashes:"
              test -f artifacts/android/repair-part-hashes.txt && cat artifacts/android/repair-part-hashes.txt
              echo "repair_gzip_check:"
              test -f artifacts/android/repair-gzip-check.txt && cat artifacts/android/repair-gzip-check.txt
              echo "repair_script_check:"
              test -f artifacts/android/repair-script-check.txt && cat artifacts/android/repair-script-check.txt
            } > artifacts/android/build-result.txt
          fi
          git add -f artifacts/android/build-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record consolidated Android build result [skip ci]"
            git push
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-Build-Evidence
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        if: ${{ hashFiles('artifacts/android/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
            artifacts/android/build-result.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce repair and APK gates
        shell: bash
        run: |
          test "${{ steps.repair.outputs.repair_exit }}" = "0"
          test -f artifacts/android/exit-code.txt
          test "$(cat artifacts/android/exit-code.txt)" = "0"
          test -s artifacts/android/SHA256SUMS.txt
