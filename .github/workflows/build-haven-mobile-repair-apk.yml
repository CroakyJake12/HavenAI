name: Build Haven Mobile Repair APK

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android

permissions:
  contents: write

concurrency:
  group: haven-mobile-repair-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Apply final nullable repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/Haven.Android/HavenLauncherActivity.Settings.cs")
          text = path.read_text(encoding="utf-8")
          old = "=> (Preferences.GetString(WidgetIdsKey, string.Empty) ?? string.Empty)"
          new = "=> (Preferences!.GetString(WidgetIdsKey, string.Empty) ?? string.Empty)"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          elif new not in text:
              raise SystemExit("Expected ReadWidgetIds nullable anchor was not found.")

          handled_old = "                args.Handled = true;"
          handled_new = "                if (args is not null)\n                    args.Handled = true;"
          if handled_old in text:
              text = text.replace(handled_old, handled_new)
              path.write_text(text, encoding="utf-8", newline="\n")
          elif handled_new not in text:
              raise SystemExit("Expected widget long-click nullable anchor was not found.")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Haven.Android/HavenLauncherActivity.Settings.cs
          if ! git diff --cached --quiet; then
            git commit -m "Guard launcher preferences access [skip ci]"
            git push
          fi

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore and publish APK
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          dotnet restore src/Haven.Android/Haven.Android.csproj --configfile NuGet.Config 2>&1 | tee artifacts/android/restore.log
          restore_exit=${PIPESTATUS[0]}
          publish_exit=99
          if [ "$restore_exit" -eq 0 ]; then
            dotnet publish src/Haven.Android/Haven.Android.csproj               -c Debug               -f net10.0-android               --no-restore               -p:AndroidPackageFormat=apk               -p:AndroidKeyStore=false               2>&1 | tee artifacts/android/publish.log
            publish_exit=${PIPESTATUS[0]}
          fi

          {
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "input_commit=${{ github.sha }}"
            echo "built_tree=$(git rev-parse HEAD)"
            echo "restore_exit=$restore_exit"
            echo "publish_exit=$publish_exit"
            echo
            echo "diagnostics:"
            grep -E -m 160 '(^|[ :])(error|warning) (CS|MSB|NETSDK|NU|XA|APT)[0-9]+' artifacts/android/*.log || true
            echo
            echo "settings_context:"
            nl -ba src/Haven.Android/HavenLauncherActivity.Settings.cs | sed -n '208,228p'
          } > artifacts/android/build-result.txt

          if [ "$restore_exit" -eq 0 ] && [ "$publish_exit" -eq 0 ]; then
            find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
            test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
            sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
            echo 0 > artifacts/android/exit-code.txt
          else
            echo 1 > artifacts/android/exit-code.txt
          fi
          exit 0

      - name: Persist build evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f artifacts/android/build-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Android APK build result [skip ci]"
            git push
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-Build-Evidence
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable APK
        if: ${{ hashFiles('artifacts/android/*.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce APK build gate
        shell: bash
        run: test "$(cat artifacts/android/exit-code.txt)" -eq 0
