name: Validate haven-continuation

non:
  pus:
    branches: [haven-continuation]
    paths:
      - .github/workflows/validate-haven-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Record haven-continuation build diagnostics') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/haven-continuation-build | Out-Null
          dotnet restore Haven.sln 2>&1 | Tee-Object artifacts/haven-continuation-build/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Haven.sln -c Release --no-restore 2>&1 | Tee-Object artifacts/haven-continuation-build/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test Haven.sln -c Release --no-build 2>&1 | Tee-Object artifacts/haven-continuation-build/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @(
            "# haven-continuation build diagnostics",
            "",
            "| Stage | Result |",
            "|---|---|",
            "| Restore | ${{ steps.restore.outcome }} |",
            "| Build | ${{ steps.build.outcome }} |",
            "| Test | ${{ steps.test.outcome }} |"
          ) | Set-Content artifacts/haven-continuation-build/VALIDATION.md
      - name: Commit diagnostics
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/haven-continuation-build
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record haven-continuation build diagnostics"
            git push origin HEAD:haven-continuation
          }
