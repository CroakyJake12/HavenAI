name: Fix idempotent new-chat mobile repair

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - .github/workflows/fix-idempotent-new-chat-repair.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make new-chat patch idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_haven_mobile_repair.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "def patch_new_chat_layout() -> None:\n"
          end_marker = "\ndef patch_chat_layout() -> None:\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit("Could not locate patch_new_chat_layout function boundaries")

          replacement = '''def patch_new_chat_layout() -> None:
            path = ROOT / "src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml"
            original = path.read_text(encoding="utf-8")
            text = original

            replacements = (
                ('Margin="54,28,54,28"', 'Margin="12,10,12,10"'),
                ('Margin="36,24,36,28"', 'Margin="12,10,12,10"'),
                ('RowSpacing="16"', 'RowSpacing="10"'),
                ('ColumnDefinitions="Auto,640,Auto"', 'ColumnDefinitions="Auto,*,Auto"'),
                ('Width="58" Height="58"', 'Width="50" Height="50"'),
                ('MinHeight="58" MaxHeight="150"', 'MinHeight="50" MaxHeight="132"'),
                ('Padding="22,0"', 'Padding="14,0"'),
                ('Width="64" Height="58"', 'Width="52" Height="50"'),
            )

            for old, new in replacements:
                if new not in text and old in text:
                    text = text.replace(old, new, 1)

            if 'ColumnDefinitions="Auto,*,Auto"' not in text:
                raise RuntimeError("New chat responsive layout: responsive composer grid not found")

            if 'MaxWidth="780"' not in text:
                for anchor in (
                    'HorizontalAlignment="Stretch" ColumnDefinitions="Auto,*,Auto"',
                    'HorizontalAlignment="Center" ColumnDefinitions="Auto,*,Auto"',
                ):
                    if anchor in text:
                        text = text.replace(
                            anchor,
                            'HorizontalAlignment="Stretch" MaxWidth="780" ColumnDefinitions="Auto,*,Auto"',
                            1,
                        )
                        break
                else:
                    raise RuntimeError("New chat responsive layout: composer alignment anchor not found")

            instruction_anchor = 'x:Name="InstructionBox"'
            instruction_index = text.find(instruction_anchor)
            if instruction_index < 0:
                raise RuntimeError("New chat responsive layout: InstructionBox not found")
            tag_end = text.find(">", instruction_index)
            if tag_end < 0:
                raise RuntimeError("New chat responsive layout: InstructionBox tag is incomplete")
            instruction_tag = text[instruction_index:tag_end]
            if 'MinWidth="0"' not in instruction_tag:
                grid_column = 'Grid.Column="1"'
                column_index = text.find(grid_column, instruction_index, tag_end)
                if column_index < 0:
                    raise RuntimeError("New chat responsive layout: InstructionBox Grid.Column anchor not found")
                insert_at = column_index + len(grid_column)
                text = text[:insert_at] + ' MinWidth="0"' + text[insert_at:]

            write_if_changed(path, text, original)

'''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding="utf-8")
          PY

          python3 -m py_compile scripts/apply_haven_mobile_repair.py
          python3 scripts/apply_haven_mobile_repair.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-idempotent-new-chat-repair.yml
          git add scripts/apply_haven_mobile_repair.py \
            src/Haven.Browser/Security/BrowserPrivateProfileManager.cs \
            src/Haven.Desktop/Interface/Shell/MainView.axaml.cs \
            src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml \
            src/Haven.Desktop/Views/Pages/Chat/ChatPage.CodeBehindLayout.cs
          git commit -m "Make mobile repair compatible with merged chat layout"
          git push origin HEAD:gpt/haven-mobile-repair-android
