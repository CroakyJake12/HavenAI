name: Fix mobile repair MainView path

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - .github/workflows/fix-mobile-repair-mainview-path.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update relocated MainView path
        shell: bash
        run: |
          set -euo pipefail
          old='src/Haven.Desktop/Views/Shell/MainView.axaml.cs'
          new='src/Haven.Desktop/Interface/Shell/MainView.axaml.cs'
          test -f "$new"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_haven_mobile_repair.py')
          s=p.read_text(encoding='utf-8')
          old='src/Haven.Desktop/Views/Shell/MainView.axaml.cs'
          new='src/Haven.Desktop/Interface/Shell/MainView.axaml.cs'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one stale path, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_haven_mobile_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-mobile-repair-mainview-path.yml
          git add scripts/apply_haven_mobile_repair.py
          git commit -m "Update mobile repair for relocated MainView"
          git push origin HEAD:gpt/haven-mobile-repair-android
