name: Restore Notes source

on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/restore-notes-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message || '', 'Restore Notes workspace source') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0

      - name: Restore source from Git history
        shell: pwsh
        run: |
          $candidates = @(
            git log --all -G 'class\s+NotesWorkspaceViewModel' --format='%H' -- src/Haven.Desktop
          ) | Select-Object -Unique

          foreach ($commit in $candidates) {
            $matches = @(git grep -l 'class NotesWorkspaceViewModel' $commit -- 'src/Haven.Desktop/*.cs' 'src/Haven.Desktop/**/*.cs' 2>$null)
            if ($LASTEXITCODE -ne 0 -or $matches.Count -eq 0) { continue }

            $entry = $matches[0].ToString()
            $separator = $entry.IndexOf(':')
            if ($separator -le 0) { continue }

            $sourcePath = $entry.Substring($separator + 1)
            $target = 'src/Haven.Desktop/ViewModels/NotesWorkspaceViewModel.cs'
            New-Item -ItemType Directory -Force (Split-Path $target -Parent) | Out-Null
            git show "$commit`:$sourcePath" | Set-Content $target -Encoding utf8

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $target
            git commit -m "Restore Notes workspace source"
            git push origin HEAD:haven-continuation
            exit 0
          }

          throw 'No historical NotesWorkspaceViewModel source was found.'
