name: Validate continuation
on:
  push:
    branches: [haven-continuation]
    paths:
      - .github/workflows/validate-continuation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', 'Record continuation validation') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/continuation-validation | Out-Null
      - id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Haven.sln 2>&1 | Tee-Object artifacts/continuation-validation/RESTORE.log
          if ($LASTEXITCODE -eq 0) {
            dotnet build Haven.sln -c Release --no-restore 2>&1 | Tee-Object artifacts/continuation-validation/BUILD.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test Haven.sln -c Release --no-build 2>&1 | Tee-Object artifacts/continuation-validation/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        shell: pwsh
        run: |
          @(
            '# Continuation validation',
            '',
            '| Stage | Result |',
            '|---|---|',
            '| Build | ${{ steps.build.outcome }} |',
            '| Test | ${{ steps.test.outcome }} |'
          ) | Set-Content artifacts/continuation-validation/VALIDATION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/continuation-validation
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record continuation validation"
            git push origin HEAD:haven-continuation
          }
      - if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -eq 'failure' -or '${{ steps.test.outcome }}' -eq 'failure') { exit 1 }
