name: Validate continuation call backend
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/validate_continuation_call_backend.py
      - scripts/apply_continuation_call_backend.py
      - .github/workflows/validate-continuation-call-backend.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'call backend validation') && !contains(github.event.head_commit.message || '', 'validated call backend') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/validate_continuation_call_backend.py
