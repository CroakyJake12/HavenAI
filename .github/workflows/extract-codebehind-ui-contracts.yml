name: Extract code-behind UI contracts

on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/extract_codebehind_ui_contracts.py
      - .github/workflows/extract-codebehind-ui-contracts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_codebehind_ui_contracts.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/codebehind-ui-contracts/CONTRACTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record code-behind UI contracts"
            git push origin HEAD:haven-continuation
          fi
