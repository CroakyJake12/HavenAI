name: Developer Tools Branch Validation

on:
  pull_request:
    branches:
      - haven-continuation
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HAVEN_DATA_DIR: ${{ runner.temp }}\haven-devtools-validation-profile
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Haven.sln

      - name: Build Debug
        run: dotnet build Haven.sln -c Debug --no-restore

      - name: Test Debug
        run: dotnet test Haven.sln -c Debug --no-build --logger "trx;LogFileName=haven-devtools-debug.trx"

      - name: Build Release
        run: dotnet build Haven.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test Haven.sln -c Release --no-build --logger "trx;LogFileName=haven-devtools-release.trx"
