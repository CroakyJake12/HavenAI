name: Validate continuation backend
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/run_continuation_backend_validation.py
      - .github/workflows/validate-continuation-backend.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/run_continuation_backend_validation.py
