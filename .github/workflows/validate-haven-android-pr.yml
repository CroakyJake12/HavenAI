name: Validate Haven Android PR

on:
  pull_request:
    branches:
      - haven-android-cloud-build
    paths:
      - ".github/workflows/validate-haven-android-pr.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "scripts/apply_haven_mobile_repair.py"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: validate-haven-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and package Android PR
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Apply deterministic mobile compatibility patch
        run: python3 scripts/apply_haven_mobile_repair.py

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android head
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Compile Android head
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/android
          dotnet build src/Haven.Android/Haven.Android.csproj             -c Debug             -f net10.0-android             --no-restore 2>&1 | tee artifacts/android/build.log

      - name: Package APK
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj             -c Debug             -f net10.0-android             --no-restore             -p:AndroidPackageFormat=apk             -p:AndroidKeyStore=false 2>&1 | tee artifacts/android/publish.log
          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android/$(basename "$apk")"
          done
          sha256sum artifacts/android/*.apk | tee artifacts/android/SHA256SUMS.txt

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-PR-${{ github.event.pull_request.number }}-Logs
          path: artifacts/android/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Android-PR-${{ github.event.pull_request.number }}-APK
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
