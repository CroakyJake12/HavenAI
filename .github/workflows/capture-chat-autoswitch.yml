name: Capture Chat auto-switch block
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/capture_chat_autoswitch.py
      - .github/workflows/capture-chat-autoswitch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message || '', 'Capture Chat auto-switch source') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/capture_chat_autoswitch.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/backend-beta/CHAT-AUTOSWITCH.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "Capture Chat auto-switch source"
            git push origin HEAD:haven-continuation
          }
