name: Diagnose PR 13 merge conflicts

on:
  push:
    branches:
      - gpt/diagnose-pr13-conflicts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce merge and capture exact conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          {
            echo "PR #13 merge diagnostic"
            echo "Repair HEAD: $(git rev-parse HEAD)"
            echo "Main HEAD: $(git rev-parse origin/main)"
            echo "Merge exit code: $merge_status"
            echo
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            echo
            echo "Conflict stages:"
            git ls-files -u
            echo
            echo "Conflict marker locations:

            git grep -nE '^(<<<<<<<|=======|>>>>>>>)$' -- . || true
          } | tee merge-conflicts.txt

          if [ "$merge_status" -eq 0 ]; then
            echo "No conflicts found."
          fi

      - name: Upload merge conflict report
        uses: actions/upload-artifact@v4
        with:
          name: pr13-merge-conflicts
          path: merge-conflicts.txt
