name: Diagnose PR 13 merge conflicts

on:
  push:
    branches:
      - gpt/diagnose-pr13-conflicts
    paths-ignore:
      - merge-conflicts.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce merge and publish exact conflict report
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          repair_head=$(git rev-parse HEAD)
          main_head=$(git rev-parse origin/main)

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          {
            echo "PR #13 merge diagnostic"
            echo "Repair HEAD: $repair_head"
            echo "Main HEAD: $main_head"
            echo "Merge exit code: $merge_status"
            echo
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            echo
            echo "Conflict stages:"
            git ls-files -u
            echo
            echo "Conflict marker locations:

            git grep -nE '^(<<<<<<<|=======|>>>>>>>)$' -- . || true
          } > /tmp/merge-conflicts.txt

          cat /tmp/merge-conflicts.txt
          git merge --abort || true
          cp /tmp/merge-conflicts.txt merge-conflicts.txt
          git add merge-conflicts.txt
          git commit -m "Record exact PR 13 merge conflicts"
          git push origin HAD:gpt/diagnose-pr13-conflicts
