name: Apply focused Chat backend
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/apply_continuation_chat_backend.py
      - .github/workflows/apply-continuation-chat-backend.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply validated Chat backend') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/apply_continuation_chat_backend.py
      - run: dotnet restore Haven.sln
      - run: dotnet build Haven.sln -c Release --no-restore
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply validated Chat backend"
            git push origin HEAD:haven-continuation
          }
