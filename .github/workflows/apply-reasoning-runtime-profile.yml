name: Apply reasoning runtime profile

on:
  push:
    branches: [gpt/new-haven-beta-pass]
    paths:
      - scripts/apply_reasoning_profile_patch.py
      - .github/workflows/apply-reasoning-runtime-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply four-step reasoning runtime profile') }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/new-haven-beta-pass
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply exact patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/reasoning-runtime | Out-Null
          python scripts/apply_reasoning_profile_patch.py 2>&1 |
            Tee-Object artifacts/reasoning-runtime/PATCH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        id: restore
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Haven.sln 2>&1 |
            Tee-Object artifacts/reasoning-runtime/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Haven.sln -c Release --no-restore 2>&1 |
            Tee-Object artifacts/reasoning-runtime/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test Haven.sln -c Release --no-build --logger "trx;LogFileName=reasoning-runtime.trx" 2>&1 |
            Tee-Object artifacts/reasoning-runtime/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write validation summary
        if: always()
        shell: pwsh
        run: |
          @(
            "# Four-step reasoning runtime validation",
            "",
            "| Stage | Result |",
            "|---|---|",
            "| Patch | ${{ steps.patch.outcome }} |",
            "| Restore | ${{ steps.restore.outcome }} |",
            "| Build | ${{ steps.build.outcome }} |",
            "| Test | ${{ steps.test.outcome }} |",
            "",
            "Reasoning levels: 25%, 50%, 75%, 100%.",
            "Accuracy-preserving large-model runtime: 100% only.",
            "No quantisation, pruning, distillation, or weight conversion is performed."
          ) | Set-Content artifacts/reasoning-runtime/VALIDATION.md

      - name: Commit patch and validation
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Core src/Haven.Infrastructure/OllamaClient.cs src/Haven.Desktop/Controls/ModelConfigurationControl.cs tests/Haven.Core.Tests scripts/apply_reasoning_profile_patch.py artifacts/reasoning-runtime
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply four-step reasoning runtime profile"
            git push origin HEAD:gpt/new-haven-beta-pass
          }

      - name: Fail on validation error
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            "${{ steps.patch.outcome }}",
            "${{ steps.restore.outcome }}",
            "${{ steps.build.outcome }}",
            "${{ steps.test.outcome }}"
          )
          if ($outcomes -contains "failure") { exit 1 }
