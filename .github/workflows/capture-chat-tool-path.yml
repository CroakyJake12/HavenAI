name: Capture Chat tool path
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/capture_chat_tool_path.py
      - .github/workflows/capture-chat-tool-path.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/capture_chat_tool_path.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/final-beta-pass/CHAT-TOOL-PATH.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m "Capture Chat tool routing diagnostics"
            git push origin HEAD:haven-continuation
          }
