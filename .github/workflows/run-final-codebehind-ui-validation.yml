name: Run final code-behind UI validation

on:
  push:
    branches: [haven-continuation]
    paths:
      - 'scripts/run_final_codebehind_ui_validation.py'
      - '.github/workflows/run-final-codebehind-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-codebehind-ui-haven-continuation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/run_final_codebehind_ui_validation.py
