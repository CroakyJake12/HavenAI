name: Resolve PR 13 on repair branch

on:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - .github/workflows/resolve-pr13-self.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          repair_head="$(git rev-parse HEAD)"

          set +e
          git merge --no-ff origin/main
          merge_status=$?
          set -e

          chat="src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml"

          if [ "$merge_status" -ne 0 ]; then
            echo "Conflicts before resolution:"
            git diff --name-status --diff-filter=U

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ "$remaining" != "$chat" ]; then
              echo "Unexpected conflict set:"
              printf '%s\n' "$remaining"
              exit 1
            fi

            git checkout --theirs -- "$chat"

            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/Haven.Desktop/Views/Pages/Chat/NewChatPage.axaml")
          text = path.read_text(encoding="utf-8")

          grid_pattern = re.compile(
              r'HorizontalAlignment="Center"\s+ColumnDefinitions="Auto,640,Auto"\s+ColumnSpacing="10"'
          )
          text, grid_count = grid_pattern.subn(
              'HorizontalAlignment="Stretch" MaxWidth="780" '
              'ColumnDefinitions="Auto,*,Auto" ColumnSpacing="10"',
              text,
              count=1,
          )
          if grid_count != 1:
              raise SystemExit(f"Expected one fixed composer grid, found {grid_count}")

          box_pattern = re.compile(
              r'(<TextBox\s+x:Name="InstructionBox"\s+Grid\.Column="1"\s+)(?!MinWidth=)',
              re.MULTILINE,
          )
          text, box_count = box_pattern.subn(
              r'\1MinWidth="0" ',
              text,
              count=1,
          )
          if box_count != 1:
              raise SystemExit(f"Expected one InstructionBox start tag, found {box_count}")

          path.write_text(text, encoding="utf-8")
          PY

            git add "$chat"
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- "$chat"; then
            echo "Conflict markers remain."
            exit 1
          fi

          git rm .github/workflows/resolve-pr13-self.yml
          git commit -m "Merge main and resolve mobile repair conflicts"
          git push origin HEAD:gpt/haven-mobile-repair-android
