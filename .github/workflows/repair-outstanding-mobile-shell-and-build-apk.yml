name: Repair Outstanding Mobile Shell and Build APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-outstanding-mobile-shell-and-build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-haven-outstanding-fixes
          fetch-depth: 0

      - name: Apply bounded Android shell repair
        shell: bash
        run: echo '' | base64 -d | python3

      - name: Commit repaired mobile shell
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repair already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/Haven.Android/MainView.Mobile.Layout.cs src/Haven.Android/MainView.Mobile.Interactions.cs
            git commit -m "Repair Android mobile shell control references"
            git push origin HEAD:mobile-haven-outstanding-fixes
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore src/Haven.Android/Haven.Android.csproj

      - name: Build Android project
        run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false
          mkdir -p artifacts/android
          find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/android/ \;
          test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt
          ls -lh artifacts/android

      - uses: actions/upload-artifact@v4
        with:
          name: Haven-Mobile-Outstanding-Fixes-APK
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30

      - name: Record successful APK build
        shell: bash
        run: |
          mkdir -p .github/build-status
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact=Haven-Mobile-Outstanding-Fixes-APK"
            echo "checksums:"
            cat artifacts/android/SHA256SUMS.txt
          } > .github/build-status/mobile-haven-apk.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/mobile-haven-apk.txt
          git commit -m "Record successful Mobile Haven APK build"
          git push origin HEAD:mobile-haven-outstanding-fixes
