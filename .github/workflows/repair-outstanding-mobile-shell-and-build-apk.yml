name: Repair Outstanding Mobile Shell and Build APK
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/repair-outstanding-mobile-shell-and-build-apk.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  repair-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: mobile-haven-outstanding-fixes
        fetch-depth: 0
    - name: Apply bounded Android shell repair
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\n\ndef replace_once(path: Path, old: str, new: str, label: str) -> None:\n    text = path.read_text()\n    count = text.count(old)\n    if count == 0 and new in text:\n        print(f\"{label}: already applied\")\n        return\n    if count != 1:\n        raise SystemExit(f\"{label}: expected one occurrence, found {count}\")\n    path.write_text(text.replace(old, new, 1))\n    print(f\"{label}: applied\")\n\nlayout = Path(\"src/Haven.Android/MainView.Mobile.Layout.cs\")\nreplace_once(\n    layout,\n    \"    private TextBox? _mobileGoInput;\\n\",\n    \"    private TextBox? _mobileGoInput;\\n\"\n    \"    private Control? _mobilePageContent;\\n\",\n    \"mobile page content field\")\n\nold_layout = \"\\n\".join([\n    \"        TopRail.IsVisible = false;\",\n    \"        SidebarControl.IsVisible = false;\",\n    \"        NativeSidebarHost.IsVisible = false;\",\n    \"        ShellContextBar.IsVisible = false;\",\n    '        body.ColumnDefinitions\
        \ = new ColumnDefinitions(\"*\");',\n    \"        body.Margin = new Thickness(0);\",\n    \"        Grid.SetColumn(contentHost, 0);\",\n    \"        Grid.SetColumnSpan(contentHost, 1);\",\n    \"\",\n    \"        ContentArea.BorderThickness = new Thickness(0);\",\n    \"        ContentArea.CornerRadius = new CornerRadius(0);\",\n    '        ContentArea.Background = ResourceBrush(\"HavenBackgroundBrush\");',\n    \"        PageContent.Margin = new Thickness(0, 0, 0, 92);\",\n])\nnew_layout = \"\\n\".join([\n    \"        foreach (var child in root.Children.ToArray())\",\n    \"        {\",\n    \"            if (Grid.GetRow(child) == 0)\",\n    \"                child.IsVisible = false;\",\n    \"        }\",\n    \"\",\n    \"        foreach (var child in body.Children.ToArray())\",\n    \"        {\",\n    \"            if (!ReferenceEquals(child, contentHost))\",\n    \"                child.IsVisible = false;\",\n    \"        }\",\n    \"\",\n    '        body.ColumnDefinitions\
        \ = new ColumnDefinitions(\"*\");',\n    \"        body.Margin = new Thickness(0);\",\n    \"        Grid.SetColumn(contentHost, 0);\",\n    \"        Grid.SetColumnSpan(contentHost, 1);\",\n    \"        _mobilePageContent = contentHost;\",\n    \"        _mobilePageContent.Margin = new Thickness(0, 0, 0, 92);\",\n])\nreplace_once(layout, old_layout, new_layout, \"runtime-located mobile shell controls\")\n\ninteractions = Path(\"src/Haven.Android/MainView.Mobile.Interactions.cs\")\nold_chrome = \"\\n\".join([\n    \"        SidebarControl.IsVisible = false;\",\n    \"        NativeSidebarHost.IsVisible = false;\",\n    \"        ShellContextBar.IsVisible = false;\",\n    \"\",\n])\nreplace_once(interactions, old_chrome, \"\", \"remove desktop named chrome references\")\n\nold_margin = \"\\n\".join([\n    \"        PageContent.Margin = isHome\",\n    \"            ? new Thickness(0, 0, 0, 78)\",\n    \"            : showChatAffordance\",\n    \"                ? new Thickness(0,\
        \ 0, 0, 112)\",\n    \"                : new Thickness(0);\",\n])\nnew_margin = \"\\n\".join([\n    \"        if (_mobilePageContent is not null)\",\n    \"            _mobilePageContent.Margin = isHome\",\n    \"                ? new Thickness(0, 0, 0, 78)\",\n    \"                : showChatAffordance\",\n    \"                    ? new Thickness(0, 0, 0, 112)\",\n    \"                    : new Thickness(0);\",\n])\nreplace_once(interactions, old_margin, new_margin, \"runtime mobile content inset\")\n\ninvalid = [\n    \"TopRail.IsVisible\",\n    \"SidebarControl.IsVisible\",\n    \"NativeSidebarHost.IsVisible\",\n    \"ShellContextBar.IsVisible\",\n    \"ContentArea.\",\n    \"PageContent.\",\n]\nfor path in (layout, interactions):\n    text = path.read_text()\n    remaining = [token for token in invalid if token in text]\n    if remaining:\n        raise SystemExit(f\"{path}: desktop-only references remain: {remaining}\")\n\nprint(\"Android shell repair validated.\")\nPY"
    - name: Commit repaired mobile shell
      shell: bash
      run: "if git diff --quiet; then\n  echo \"Repair already present.\"\nelse\n  git config user.name \"github-actions[bot]\"\n  git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n  git add src/Haven.Android/MainView.Mobile.Layout.cs src/Haven.Android/MainView.Mobile.Interactions.cs\n  git commit -m \"Repair Android mobile shell control references\"\n  git push origin HEAD:mobile-haven-outstanding-fixes\nfi"
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Install Android workload
      run: dotnet workload install android
    - name: Restore Android project
      run: dotnet restore src/Haven.Android/Haven.Android.csproj
    - name: Build Android project
      run: dotnet build src/Haven.Android/Haven.Android.csproj -c Debug --no-restore
    - name: Publish APK
      shell: bash
      run: 'dotnet publish src/Haven.Android/Haven.Android.csproj   -c Debug   -f net10.0-android   --no-restore   -p:AndroidPackageFormat=apk   -p:AndroidKeyStore=false

        mkdir -p artifacts/android

        find src/Haven.Android/bin/Debug/net10.0-android -type f -name ''*.apk'' -exec cp {} artifacts/android/ \;

        test -n "$(find artifacts/android -type f -name ''*.apk'' -print -quit)"

        sha256sum artifacts/android/*.apk > artifacts/android/SHA256SUMS.txt

        ls -lh artifacts/android'
    - uses: actions/upload-artifact@v4
      with:
        name: Haven-Mobile-Outstanding-Fixes-APK
        path: artifacts/android
        if-no-files-found: error
        retention-days: 30
    - name: Record successful APK build
      shell: bash
      run: "mkdir -p .github/build-status\n{\n  echo \"source_commit=$(git rev-parse HEAD)\"\n  echo \"workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"\n  echo \"artifact=Haven-Mobile-Outstanding-Fixes-APK\"\n  echo \"checksums:\"\n  cat artifacts/android/SHA256SUMS.txt\n} > .github/build-status/mobile-haven-apk.txt\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add .github/build-status/mobile-haven-apk.txt\ngit commit -m \"Record successful Mobile Haven APK build\"\ngit push origin HEAD:mobile-haven-outstanding-fixes"
