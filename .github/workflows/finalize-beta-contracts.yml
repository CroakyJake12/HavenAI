name: Finalize beta contracts
on:
  push:
    branches: [haven-continuation]
    paths:
      - scripts/fix_final_beta_contracts.py
      - .github/workflows/finalize-beta-contracts.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', 'Finalize validated beta contracts') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haven-continuation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply final fixes
        run: python scripts/fix_final_beta_contracts.py
      - name: Restore
        run: dotnet restore Haven.sln
      - name: Build
        run: dotnet build Haven.sln -c Release --no-restore
      - name: Core tests
        run: dotnet test tests/Haven.Core.Tests/Haven.Core.Tests.csproj -c Release --no-build
      - name: Commit validated fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Haven.Core/ChatCapabilitySelection.cs src/Haven.Desktop/Views/Pages/Chat/ChatPage.axaml scripts/fix_final_beta_contracts.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Finalize validated beta contracts"
            git push origin HEAD:haven-continuation
          }
