name: Apply Mobile Shell Follow-up Repair

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/haven-mobile-repair-android
    paths:
      - '.github/workflows/apply-mobile-shell-followup.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and apply follow-up repair
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/android
          echo "5fb38fb2d8ee414dc58b745953e61fed13a4512bbdcc7e0e98bf7f3dc813c5d4  scripts/patch_mobile_shell_followup.py.gz" | sha256sum -c - > artifacts/android/mobile-shell-repair.log 2>&1
          integrity_exit=$?
          if [ "$integrity_exit" -eq 0 ]; then
            gzip -t scripts/patch_mobile_shell_followup.py.gz >> artifacts/android/mobile-shell-repair.log 2>&1
            integrity_exit=$?
          fi
          if [ "$integrity_exit" -eq 0 ]; then
            gzip -dc scripts/patch_mobile_shell_followup.py.gz > /tmp/patch_mobile_shell_followup.py
            echo "832feb66c5f39343f4025f0d19a240ea0cd1823bce70899c970e50eaa409b027  /tmp/patch_mobile_shell_followup.py" | sha256sum -c - >> artifacts/android/mobile-shell-repair.log 2>&1
            integrity_exit=$?
          fi
          if [ "$integrity_exit" -eq 0 ]; then
            python -m py_compile /tmp/patch_mobile_shell_followup.py >> artifacts/android/mobile-shell-repair.log 2>&1
            integrity_exit=$?
          fi
          repair_exit=99
          if [ "$integrity_exit" -eq 0 ]; then
            python /tmp/patch_mobile_shell_followup.py >> artifacts/android/mobile-shell-repair.log 2>&1
            repair_exit=$?
          fi
          {
            echo "input_commit=${GITHUB_SHA}"
            echo "integrity_exit=${integrity_exit}"
            echo "repair_exit=${repair_exit}"
            echo "log_tail:"
            tail -n 300 artifacts/android/mobile-shell-repair.log
          } > artifacts/android/mobile-shell-repair-result.txt
          echo "integrity_exit=${integrity_exit}" >> "$GITHUB_OUTPUT"
          echo "repair_exit=${repair_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repair result
        shell: bash
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.repair.outputs.integrity_exit }}" = "0" ] && [ "${{ steps.repair.outputs.repair_exit }}" = "0" ]; then
            git add \
              src/Haven.Android/MainView.Mobile.Layout.cs \
              src/Haven.Android/MainView.Mobile.Interactions.cs \
              src/Haven.Android/MainView.Mobile.Drawers.cs \
              src/Haven.Android/HavenLauncherActivity.cs \
              src/Haven.Android/HavenLauncherActivity.Apps.cs \
              src/Haven.Desktop/Views/Shell/MainView.axaml.cs \
              src/Haven.Desktop/Views/Pages/Go/GoPage.axaml
            message="Apply mobile shell and launcher follow-up repair [skip ci]"
          else
            git add -f artifacts/android/mobile-shell-repair-result.txt
            message="Record mobile shell follow-up repair failure [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push
          fi
          test "${{ steps.repair.outputs.integrity_exit }}" = "0"
          test "${{ steps.repair.outputs.repair_exit }}" = "0"

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Haven-Mobile-Shell-Repair-Evidence
          path: artifacts/android
          if-no-files-found: error
          retention-days: 30
